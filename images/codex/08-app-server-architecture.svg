<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="App Server Architecture">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 13px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }

    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .card-async { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .card-warn { fill: rgba(239,68,68,0.08); stroke: rgba(239,68,68,0.3); stroke-width: 1.5; }
    .card-core { fill: rgba(168,85,247,0.08); stroke: rgba(168,85,247,0.4); stroke-width: 2; }

    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-warn { fill: none; stroke: rgba(239,68,68,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(63,185,80,0.8)"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(239,68,68,0.8)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">APP SERVER ARCHITECTURE</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">Decoupling UI from the core engine via a lightweight JSON-RPC protocol</text>

  <!-- Left: External Clients -->
  <rect x="50" y="160" width="220" height="320" rx="12" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="160" y="195" class="card-title" fill="#8b9eb3">External Clients</text>

  <rect x="70" y="220" width="180" height="60" rx="8" class="inner-card"/>
  <text x="160" y="248" class="card-title">IDE Plugin</text>
  <text x="160" y="268" class="inner-sub">(VS Code, etc.)</text>

  <rect x="70" y="300" width="180" height="60" rx="8" class="inner-card"/>
  <text x="160" y="328" class="card-title">CLI TUI</text>
  <text x="160" y="348" class="inner-sub">InProcess Mode</text>

  <rect x="70" y="380" width="180" height="60" rx="8" class="inner-card"/>
  <text x="160" y="408" class="card-title">Remote Script</text>
  <text x="160" y="428" class="inner-sub">Headless Client</text>

  <!-- Center: Protocol & Transport -->
  <path d="M 270 230 L 450 230" class="spine" marker-end="url(#arrow)"/>
  <text x="360" y="220" class="arrow-text">ClientRequest</text>
  <text x="360" y="245" class="inner-sub">e.g., turn/start</text>

  <path d="M 450 320 L 270 320" class="spine-async" marker-end="url(#arrow-async)"/>
  <text x="360" y="310" class="arrow-text" fill="#3fb950">ServerNotification</text>
  <text x="360" y="335" class="inner-sub" fill="#3fb950">e.g., agentMessage/delta</text>

  <path d="M 450 410 L 270 410" class="spine-warn" marker-end="url(#arrow-warn)"/>
  <text x="360" y="400" class="arrow-text" fill="#ef4444">ServerRequest</text>
  <text x="360" y="425" class="inner-sub" fill="#ef4444">e.g., requestApproval</text>

  <rect x="310" y="460" width="100" height="30" rx="4" fill="#0d1117" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="360" y="480" class="inner-sub">stdio / unix / ws</text>

  <!-- Right: App Server & Core Engine -->
  <rect x="450" y="160" width="480" height="320" rx="16" class="card-core"/>
  <text x="690" y="200" class="card-title">codex-app-server</text>

  <rect x="480" y="230" width="200" height="60" rx="8" class="card-highlight"/>
  <text x="580" y="258" class="inner-text">MessageProcessor</text>
  <text x="580" y="278" class="inner-sub">Deserialization</text>

  <rect x="480" y="310" width="200" height="60" rx="8" class="card-highlight"/>
  <text x="580" y="338" class="inner-text">TurnRequestProcessor</text>
  <text x="580" y="358" class="inner-sub">Serialization Scope</text>

  <rect x="710" y="230" width="190" height="220" rx="12" class="card"/>
  <text x="805" y="265" class="card-title">codex-core</text>
  
  <rect x="730" y="290" width="150" height="40" rx="6" class="inner-card"/>
  <text x="805" y="315" class="inner-text">ThreadManager</text>

  <rect x="730" y="340" width="150" height="40" rx="6" class="inner-card"/>
  <text x="805" y="365" class="inner-text">SessionTask</text>

  <rect x="730" y="390" width="150" height="40" rx="6" class="inner-card"/>
  <text x="805" y="415" class="inner-text">EventMsg</text>

  <!-- Internal Arrows -->
  <path d="M 680 260 L 710 260" class="spine" marker-end="url(#arrow)"/>
  <path d="M 680 340 L 710 340" class="spine" marker-end="url(#arrow)"/>
  <path d="M 710 410 L 630 410 L 630 370" class="spine-async" marker-end="url(#arrow-async)"/>

</svg>