<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Dynamic Fragment Injection">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 13px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }

    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .card-async { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .card-warn { fill: rgba(239,68,68,0.08); stroke: rgba(239,68,68,0.3); stroke-width: 1.5; }
    .card-core { fill: rgba(168,85,247,0.08); stroke: rgba(168,85,247,0.4); stroke-width: 2; }

    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-warn { fill: none; stroke: rgba(239,68,68,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">DYNAMIC FRAGMENT INJECTION</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">Subsystems generate fragments that are routed to specific slots</text>

  <!-- Top: Context Contributors (Subsystems) -->
  <rect x="150" y="150" width="200" height="60" rx="8" class="inner-card"/>
  <text x="250" y="185" class="inner-text">Sandbox State</text>

  <rect x="400" y="150" width="200" height="60" rx="8" class="inner-card"/>
  <text x="500" y="185" class="inner-text">MCP Server</text>

  <rect x="650" y="150" width="200" height="60" rx="8" class="inner-card"/>
  <text x="750" y="185" class="inner-text">AGENTS.md</text>

  <!-- Middle: Generated PromptFragments -->
  <path d="M 250 210 L 250 240" class="spine" marker-end="url(#arrow)"/>
  <path d="M 500 210 L 500 240" class="spine" marker-end="url(#arrow)"/>
  <path d="M 750 210 L 750 240" class="spine" marker-end="url(#arrow)"/>

  <rect x="170" y="240" width="160" height="70" rx="6" class="card-warn"/>
  <text x="250" y="270" class="inner-text" fill="#ef4444">Fragment</text>
  <text x="250" y="295" class="inner-sub">Slot: DeveloperPolicy</text>

  <rect x="420" y="240" width="160" height="70" rx="6" class="card-warn"/>
  <text x="500" y="270" class="inner-text" fill="#ef4444">Fragment</text>
  <text x="500" y="295" class="inner-sub">Slot: DevCapabilities</text>

  <rect x="670" y="240" width="160" height="70" rx="6" class="card-highlight"/>
  <text x="750" y="270" class="inner-text">Fragment</text>
  <text x="750" y="295" class="inner-sub">Slot: ContextualUser</text>

  <!-- Routing Arrows -->
  <path d="M 250 310 L 250 350 L 375 350 L 375 380" class="spine" marker-end="url(#arrow)"/>
  <path d="M 500 310 L 500 350 L 375 350 L 375 380" class="spine" marker-end="url(#arrow)"/>
  <path d="M 750 310 L 750 350 L 625 350 L 625 380" class="spine" marker-end="url(#arrow)"/>

  <!-- Bottom: Target Slots -->
  <rect x="250" y="380" width="250" height="80" rx="12" class="card-warn"/>
  <text x="375" y="420" class="card-title" fill="#ef4444">Developer Slots</text>
  <text x="375" y="445" class="inner-text">Receives Policy &amp; Caps</text>

  <rect x="500" y="380" width="250" height="80" rx="12" class="card-highlight"/>
  <text x="625" y="420" class="card-title">Contextual User Slot</text>
  <text x="625" y="445" class="inner-text">Receives Environment</text>

  <!-- Assembly Line Box -->
  <rect x="100" y="120" width="800" height="380" rx="16" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="500" y="530" class="card-title" fill="#8b9eb3">ContextContributor Trait Pipeline</text>

</svg>