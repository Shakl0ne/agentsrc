<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Thread Isolation and Inheritance">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 13px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }

    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .card-async { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .card-warn { fill: rgba(239,68,68,0.08); stroke: rgba(239,68,68,0.3); stroke-width: 1.5; }
    .card-core { fill: rgba(168,85,247,0.08); stroke: rgba(168,85,247,0.4); stroke-width: 2; }

    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-warn { fill: none; stroke: rgba(239,68,68,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(239,68,68,0.8)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">THREAD ISOLATION AND INHERITANCE</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">Each Agent runs in an isolated CodexThread while inheriting security policies</text>

  <!-- Top Center: ThreadManager -->
  <rect x="350" y="140" width="300" height="60" rx="12" class="card-core"/>
  <text x="500" y="178" class="card-title">ThreadManager</text>

  <path d="M 500 200 L 500 230 L 250 230 L 250 255" class="spine" marker-end="url(#arrow)"/>
  <path d="M 500 200 L 500 230 L 750 230 L 750 255" class="spine" marker-end="url(#arrow)"/>

  <!-- Left: Parent Agent -->
  <rect x="60" y="260" width="380" height="220" rx="12" class="card-highlight"/>
  <text x="250" y="300" class="card-title">Parent Agent</text>
  <text x="250" y="320" class="inner-sub">CodexThread (ID: 1)</text>

  <rect x="80" y="340" width="340" height="50" rx="6" class="inner-card"/>
  <text x="250" y="370" class="inner-text">Session History A</text>

  <rect x="80" y="400" width="340" height="60" rx="6" class="card-warn"/>
  <text x="250" y="425" class="inner-text" fill="#ef4444">Security Profile</text>
  <text x="250" y="445" class="inner-sub">ExecPolicy and Sandbox</text>

  <!-- Right: Child Agent -->
  <rect x="560" y="260" width="380" height="220" rx="12" class="card-async" style="stroke-dasharray: none;"/>
  <text x="750" y="300" class="card-title">Child Agent</text>
  <text x="750" y="320" class="inner-sub">CodexThread (ID: 2)</text>

  <rect x="580" y="340" width="340" height="50" rx="6" class="inner-card"/>
  <text x="750" y="370" class="inner-text">Session History B (Isolated)</text>

  <rect x="580" y="400" width="340" height="60" rx="6" class="card-warn"/>
  <text x="750" y="425" class="inner-text" fill="#ef4444">Security Profile</text>
  <text x="750" y="445" class="inner-sub">Inherited from Parent</text>

  <!-- Inheritance Arrow -->
  <path d="M 420 430 L 575 430" class="spine-warn" stroke-dasharray="6 6" marker-end="url(#arrow-warn)"/>
  <text x="500" y="420" class="arrow-text" fill="#ef4444">Inherits Policy</text>

  <!-- Isolation Barrier -->
  <line x1="500" y1="280" x2="500" y2="500" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-dasharray="10 10"/>
  <rect x="420" y="350" width="160" height="30" rx="4" fill="#0d1117" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <text x="500" y="370" class="inner-sub">Strict State Isolation</text>

</svg>