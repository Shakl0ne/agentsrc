<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="The Four Pillars of Prompt">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 13px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }

    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .card-async { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .card-warn { fill: rgba(239,68,68,0.08); stroke: rgba(239,68,68,0.3); stroke-width: 1.5; }
    .card-core { fill: rgba(168,85,247,0.08); stroke: rgba(168,85,247,0.4); stroke-width: 2; }

    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-warn { fill: none; stroke: rgba(239,68,68,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(63,185,80,0.8)"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(239,68,68,0.8)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">THE FOUR PILLARS OF PROMPT</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">The Prompt is a structured data model, not a concatenated string</text>

  <!-- Left: The 4 Pillars -->
  <rect x="80" y="160" width="220" height="60" rx="8" class="card-warn"/>
  <text x="190" y="188" class="card-title" fill="#ef4444">base_instructions</text>
  <text x="190" y="208" class="inner-sub">Core system rules</text>

  <rect x="80" y="250" width="220" height="60" rx="8" class="card"/>
  <text x="190" y="278" class="card-title">tools</text>
  <text x="190" y="298" class="inner-sub">ToolRouter schemas</text>

  <rect x="80" y="340" width="220" height="60" rx="8" class="inner-card"/>
  <text x="190" y="368" class="card-title">input</text>
  <text x="190" y="388" class="inner-sub">Multi-turn message stream</text>

  <rect x="80" y="430" width="220" height="60" rx="8" class="card-highlight"/>
  <text x="190" y="458" class="card-title">Context Updates</text>
  <text x="190" y="478" class="inner-sub">Dynamic fragments / Diffs</text>

  <!-- Center: The Prompt Struct -->
  <rect x="450" y="240" width="240" height="170" rx="16" class="card-core"/>
  <text x="570" y="315" class="card-title">The Prompt Struct</text>
  <text x="570" y="345" class="inner-text">Structured Payload</text>

  <!-- Convergence Arrows -->
  <path d="M 300 190 L 375 190 L 375 300 L 450 300" class="spine" marker-end="url(#arrow)"/>
  <path d="M 300 280 L 375 280 L 375 310 L 450 310" class="spine" marker-end="url(#arrow)"/>
  <path d="M 300 370 L 375 370 L 375 340 L 450 340" class="spine" marker-end="url(#arrow)"/>
  <path d="M 300 460 L 375 460 L 375 350 L 450 350" class="spine" marker-end="url(#arrow)"/>

  <!-- Right: Output -->
  <path d="M 690 325 L 760 325" class="spine-async" marker-end="url(#arrow-async)"/>
  
  <rect x="760" y="295" width="180" height="60" rx="12" class="card-async" style="stroke-dasharray: none;"/>
  <text x="850" y="323" class="card-title">LLM Request</text>
  <text x="850" y="343" class="inner-sub">Provider API</text>

</svg>