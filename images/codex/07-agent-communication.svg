<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="V2 Agent Communication">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 14px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }

    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .card-async { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; }
    .card-warn { fill: rgba(239,68,68,0.08); stroke: rgba(239,68,68,0.3); stroke-width: 1.5; }
    .card-core { fill: rgba(168,85,247,0.08); stroke: rgba(168,85,247,0.4); stroke-width: 2; }

    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-warn { fill: none; stroke: rgba(239,68,68,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(63,185,80,0.8)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">V2 AGENT COMMUNICATION (ACTOR MODEL)</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">Explicit message passing via AgentPath and Mailbox</text>

  <!-- Top Left: Parent Agent -->
  <rect x="40" y="160" width="300" height="160" rx="12" class="card-highlight"/>
  <text x="190" y="200" class="card-title">Parent Agent</text>
  <text x="190" y="225" class="inner-sub">AgentPath: /root</text>

  <rect x="60" y="240" width="260" height="60" rx="8" class="card-core"/>
  <text x="190" y="265" class="inner-text">Mailbox (Event Queue)</text>
  <text x="190" y="285" class="inner-sub">Awaits incoming messages</text>

  <!-- Bottom Right: Child Agent -->
  <rect x="660" y="360" width="300" height="120" rx="12" class="card"/>
  <text x="810" y="400" class="card-title">Child Agent</text>
  <text x="810" y="425" class="inner-sub">AgentPath: /root/researcher</text>

  <rect x="680" y="440" width="260" height="24" rx="4" fill="rgba(255,255,255,0.05)"/>
  <text x="810" y="456" class="inner-sub">Completes task and reports back</text>

  <!-- The Message Payload (Middle) -->
  <rect x="340" y="360" width="280" height="120" rx="8" class="card-async"/>
  <text x="480" y="390" class="inner-text" fill="#3fb950">InterAgentCommunication</text>
  
  <text x="360" y="420" class="inner-sub" style="text-anchor: start;">author: /root/researcher</text>
  <text x="360" y="440" class="inner-sub" style="text-anchor: start;">recipient: /root</text>
  <text x="360" y="460" class="inner-sub" style="text-anchor: start;">trigger_turn: true</text>

  <!-- Message Passing Arrows -->
  <path d="M 660 420 L 625 420" class="spine-async" marker-end="url(#arrow-async)"/>
  <path d="M 480 360 L 480 270 L 325 270" class="spine-async" marker-end="url(#arrow-async)"/>

</svg>