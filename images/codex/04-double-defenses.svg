<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Double Compaction Defenses">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 13px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }

    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .card-async { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .card-warn { fill: rgba(239,68,68,0.08); stroke: rgba(239,68,68,0.3); stroke-width: 1.5; }
    .card-core { fill: rgba(168,85,247,0.08); stroke: rgba(168,85,247,0.4); stroke-width: 2; }

    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-warn { fill: none; stroke: rgba(239,68,68,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(239,68,68,0.8)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">DOUBLE COMPACTION DEFENSES</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">Active token budget protection wrapping the core sampling loop</text>

  <!-- Left: Entry -->
  <rect x="50" y="260" width="160" height="60" rx="8" class="inner-card"/>
  <text x="130" y="295" class="card-title">run_turn()</text>
  <text x="130" y="315" class="inner-sub">Start</text>

  <path d="M 210 290 L 260 290" class="spine" marker-end="url(#arrow)"/>

  <!-- Gate 1: Pre-Sampling -->
  <rect x="260" y="200" width="200" height="180" rx="12" class="card-warn"/>
  <text x="360" y="240" class="card-title" fill="#ef4444">GATE 1</text>
  <text x="360" y="270" class="inner-text">Pre-Sampling</text>
  <text x="360" y="295" class="inner-text">Compact</text>
  
  <rect x="280" y="320" width="160" height="40" rx="6" fill="rgba(239,68,68,0.1)"/>
  <text x="360" y="345" class="inner-sub">Check budget before LLM</text>

  <path d="M 460 290 L 510 290" class="spine" marker-end="url(#arrow)"/>

  <!-- Core: LLM Sampling -->
  <rect x="510" y="230" width="200" height="120" rx="16" class="card-highlight"/>
  <text x="610" y="280" class="card-title">LLM Sampling</text>
  <text x="610" y="310" class="inner-text">&amp; Tool Execution</text>

  <path d="M 710 290 L 760 290" class="spine" marker-end="url(#arrow)"/>

  <!-- Gate 2: Mid-Turn -->
  <rect x="760" y="200" width="200" height="180" rx="12" class="card-warn"/>
  <text x="860" y="240" class="card-title" fill="#ef4444">GATE 2</text>
  <text x="860" y="270" class="inner-text">Mid-Turn</text>
  <text x="860" y="295" class="inner-text">Auto-Compact</text>

  <rect x="780" y="320" width="160" height="40" rx="6" fill="rgba(239,68,68,0.1)"/>
  <text x="860" y="345" class="inner-sub">If (limit &amp;&amp; needs_followup)</text>

  <!-- Loopback Arrow -->
  <path d="M 860 380 L 860 440 L 610 440 L 610 350" class="spine-warn" marker-end="url(#arrow-warn)"/>
  <text x="735" y="430" class="arrow-text" fill="#ef4444">Protects next iteration</text>

</svg>