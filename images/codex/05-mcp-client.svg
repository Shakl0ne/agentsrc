<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Codex as MCP Client">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 13px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }

    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .card-async { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .card-warn { fill: rgba(239,68,68,0.08); stroke: rgba(239,68,68,0.3); stroke-width: 1.5; }
    .card-core { fill: rgba(168,85,247,0.08); stroke: rgba(168,85,247,0.4); stroke-width: 2; }

    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-warn { fill: none; stroke: rgba(239,68,68,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(63,185,80,0.8)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">CODEX AS MCP CLIENT</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">McpConnectionManager aggregates external capabilities into internal routing</text>

  <!-- Left: Codex Internal -->
  <rect x="60" y="250" width="240" height="100" rx="12" class="card-highlight"/>
  <text x="180" y="295" class="card-title">Codex Internal</text>
  <text x="180" y="325" class="inner-text">(ToolRegistry)</text>

  <!-- Center: McpConnectionManager -->
  <rect x="400" y="230" width="240" height="140" rx="16" class="card-core"/>
  <text x="520" y="275" class="card-title">McpConnection</text>
  <text x="520" y="300" class="card-title">Manager</text>
  
  <rect x="420" y="320" width="200" height="30" rx="4" class="card"/>
  <text x="520" y="340" class="inner-sub">Process Lifecycle &amp; Auth</text>

  <!-- Right: External MCP Servers -->
  <rect x="720" y="180" width="240" height="240" rx="12" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="840" y="210" class="inner-text" fill="#8b9eb3">External MCP Servers</text>

  <rect x="740" y="230" width="200" height="40" rx="6" class="card-async" style="stroke-dasharray: none;"/>
  <text x="840" y="255" class="inner-text">SQLite Server</text>

  <rect x="740" y="290" width="200" height="40" rx="6" class="card-async" style="stroke-dasharray: none;"/>
  <text x="840" y="315" class="inner-text">Slack Server</text>

  <rect x="740" y="350" width="200" height="40" rx="6" class="card-async" style="stroke-dasharray: none;"/>
  <text x="840" y="375" class="inner-text">GitHub Server</text>

  <!-- Arrows (Right to Left flow) -->
  <path d="M 720 300 L 640 300" class="spine-async" marker-end="url(#arrow-async)"/>
  <text x="680" y="290" class="arrow-text" fill="#3fb950" text-anchor="end">Aggregates</text>

  <path d="M 400 300 L 300 300" class="spine" marker-end="url(#arrow)"/>
  <text x="350" y="290" class="arrow-text" text-anchor="middle">Registers</text>

</svg>