<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Steering vs Abort">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 13px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }

    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .card-async { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .card-warn { fill: rgba(239,68,68,0.08); stroke: rgba(239,68,68,0.3); stroke-width: 1.5; }
    .card-core { fill: rgba(168,85,247,0.08); stroke: rgba(168,85,247,0.4); stroke-width: 2; }

    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-warn { fill: none; stroke: rgba(239,68,68,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(63,185,80,0.8)"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(239,68,68,0.8)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">STEERING VS ABORT</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">Smoothly appending new inputs to active tasks instead of killing them</text>

  <!-- Left: New Input -->
  <rect x="50" y="270" width="200" height="60" rx="12" class="card-warn"/>
  <text x="150" y="305" class="card-title" fill="#ef4444">New User Input</text>
  <text x="150" y="325" class="inner-sub">Arrives mid-generation</text>

  <path d="M 250 300 L 330 300" class="spine" marker-end="url(#arrow)"/>

  <!-- Center: Decision -->
  <polygon points="430,250 530,300 430,350 330,300" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.4)" stroke-width="2"/>
  <text x="430" y="295" class="inner-text">Is there an</text>
  <text x="430" y="315" class="inner-text">Active Turn?</text>

  <!-- Top Branch: Yes (Steer) -->
  <path d="M 480 275 L 530 250 L 650 250" class="spine-async" marker-end="url(#arrow-async)"/>
  <text x="580" y="240" class="arrow-text" fill="#3fb950">Yes (steer_input)</text>

  <rect x="650" y="210" width="280" height="80" rx="12" class="card-async" style="stroke-dasharray: none;"/>
  <text x="790" y="245" class="card-title">Append to Pending</text>
  <text x="790" y="270" class="inner-text">Task Continues Smoothly</text>

  <!-- Bottom Branch: No (Spawn) -->
  <path d="M 480 325 L 530 350 L 650 350" class="spine" marker-end="url(#arrow)"/>
  <text x="580" y="340" class="arrow-text">No (NoActiveTurn)</text>

  <rect x="650" y="310" width="280" height="80" rx="12" class="inner-card"/>
  <text x="790" y="345" class="card-title">spawn_task()</text>
  <text x="790" y="370" class="inner-text">Starts New RegularTask</text>

</svg>