<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Reverse Approval Flow">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 13px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }

    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .card-async { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .card-warn { fill: rgba(239,68,68,0.08); stroke: rgba(239,68,68,0.3); stroke-width: 1.5; }
    .card-core { fill: rgba(168,85,247,0.08); stroke: rgba(168,85,247,0.4); stroke-width: 2; }

    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-warn { fill: none; stroke: rgba(239,68,68,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(63,185,80,0.8)"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(239,68,68,0.8)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">REVERSE APPROVAL FLOW</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">How the backend engine requests human intervention from the frontend</text>

  <!-- Top: External IDE (User UI) -->
  <rect x="350" y="140" width="300" height="80" rx="12" class="card-highlight"/>
  <text x="500" y="180" class="card-title">External IDE (UI)</text>
  <text x="500" y="205" class="inner-text">Prompts User: "Allow Command?"</text>

  <!-- Middle: App Server -->
  <rect x="350" y="300" width="300" height="80" rx="12" class="card-core"/>
  <text x="500" y="340" class="card-title">codex-app-server</text>
  <text x="500" y="365" class="inner-text">Protocol Translator</text>

  <!-- Bottom: Core Engine -->
  <rect x="350" y="460" width="300" height="80" rx="12" class="card-warn"/>
  <text x="500" y="500" class="card-title" fill="#ef4444">codex-core</text>
  <text x="500" y="525" class="inner-text">Task Suspended (Awaiting Decision)</text>

  <!-- Upward Arrows (Request) -->
  <path d="M 450 460 L 450 380" class="spine-warn" marker-end="url(#arrow-warn)"/>
  <text x="440" y="425" class="arrow-text" fill="#ef4444" text-anchor="end">1. Needs Approval</text>

  <path d="M 450 300 L 450 220" class="spine-warn" marker-end="url(#arrow-warn)"/>
  <text x="440" y="265" class="arrow-text" fill="#ef4444" text-anchor="end">2. ServerRequest</text>

  <!-- Downward Arrows (Response) -->
  <path d="M 550 220 L 550 300" class="spine-async" marker-end="url(#arrow-async)"/>
  <text x="560" y="265" class="arrow-text" fill="#3fb950" style="text-anchor: start;">3. Response (Allow)</text>

  <path d="M 550 380 L 550 460" class="spine-async" marker-end="url(#arrow-async)"/>
  <text x="560" y="425" class="arrow-text" fill="#3fb950" style="text-anchor: start;">4. Op::ExecApproval</text>

  <!-- Annotations -->
  <rect x="50" y="240" width="260" height="40" rx="6" fill="rgba(239,68,68,0.1)"/>
  <text x="180" y="265" class="inner-sub" fill="#ef4444">item/commandExecution/requestApproval</text>

  <rect x="690" y="400" width="260" height="40" rx="6" fill="rgba(63,185,80,0.1)"/>
  <text x="820" y="425" class="inner-sub" fill="#3fb950">Wakes up suspended task to resume</text>

</svg>