<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Hybrid Compacted History">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 13px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }

    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .card-async { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .card-warn { fill: rgba(239,68,68,0.08); stroke: rgba(239,68,68,0.3); stroke-width: 1.5; }
    .card-core { fill: rgba(168,85,247,0.08); stroke: rgba(168,85,247,0.4); stroke-width: 2; }

    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-warn { fill: none; stroke: rgba(239,68,68,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">HYBRID COMPACTED HISTORY</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">Combining retained raw messages with an LLM-generated semantic summary</text>

  <!-- Left: Before (Bloated History) -->
  <rect x="80" y="160" width="260" height="360" rx="12" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="210" y="195" class="card-title" fill="#8b9eb3">BEFORE</text>
  <text x="210" y="215" class="inner-sub">Bloated History (20+ Turns)</text>

  <rect x="110" y="240" width="200" height="40" rx="6" class="inner-card"/>
  <text x="210" y="265" class="inner-text">Turn 1 (Initial Request)</text>

  <rect x="110" y="290" width="200" height="40" rx="6" class="inner-card"/>
  <text x="210" y="315" class="inner-text">Turn 2 (Tool Output)</text>

  <text x="210" y="360" class="inner-text" fill="#8b9eb3">...</text>

  <rect x="110" y="380" width="200" height="40" rx="6" class="inner-card"/>
  <text x="210" y="405" class="inner-text">Turn 19 (Code Edit)</text>

  <rect x="110" y="430" width="200" height="40" rx="6" class="inner-card"/>
  <text x="210" y="455" class="inner-text">Turn 20 (Error Log)</text>

  <!-- Center: Transformation -->
  <path d="M 340 340 L 400 340" class="spine" marker-end="url(#arrow)"/>

  <rect x="400" y="290" width="200" height="100" rx="16" class="card-core"/>
  <text x="500" y="335" class="card-title">LLM Semantic</text>
  <text x="500" y="365" class="inner-text">Summarization</text>

  <rect x="420" y="400" width="160" height="30" rx="4" class="card"/>
  <text x="500" y="420" class="inner-sub">Fallback Truncation</text>

  <path d="M 600 340 L 660 340" class="spine" marker-end="url(#arrow)"/>

  <!-- Right: After (Compacted Structure) -->
  <rect x="660" y="160" width="260" height="360" rx="12" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="790" y="195" class="card-title" fill="#3fb950">AFTER</text>
  <text x="790" y="215" class="inner-sub">Hybrid Compacted Structure</text>

  <rect x="690" y="240" width="200" height="40" rx="6" class="card-async" style="stroke-dasharray: none;"/>
  <text x="790" y="265" class="inner-text">Turn 19 (Code Edit)</text>

  <rect x="690" y="290" width="200" height="40" rx="6" class="card-async" style="stroke-dasharray: none;"/>
  <text x="790" y="315" class="inner-text">Turn 20 (Error Log)</text>

  <text x="790" y="355" class="inner-sub" fill="#3fb950">Retained Raw Messages</text>

  <rect x="690" y="380" width="200" height="100" rx="12" class="card-highlight"/>
  <text x="790" y="425" class="card-title">Compaction Node</text>
  <text x="790" y="455" class="inner-text">(LLM Summary)</text>

</svg>