<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Roles and Hard Boundaries">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 13px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }

    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .card-async { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .card-warn { fill: rgba(239,68,68,0.08); stroke: rgba(239,68,68,0.3); stroke-width: 1.5; }
    .card-core { fill: rgba(168,85,247,0.08); stroke: rgba(168,85,247,0.4); stroke-width: 2; }

    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-warn { fill: none; stroke: rgba(239,68,68,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(63,185,80,0.8)"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(239,68,68,0.8)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">ROLES &amp; HARD BOUNDARIES</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">Three isolated phases with strict allowed-tools whitelists</text>

  <!-- Column 1: PLAN -->
  <text x="190" y="160" class="card-title" fill="#8b9eb3">1. PLAN PHASE</text>
  
  <rect x="60" y="190" width="260" height="80" rx="12" class="card-core"/>
  <text x="190" y="230" class="card-title">Prometheus (Planner)</text>
  <text x="190" y="255" class="inner-text">Defines scope &amp; tasks</text>

  <path d="M 190 270 L 190 310" class="spine" marker-end="url(#arrow)"/>

  <rect x="60" y="310" width="260" height="80" rx="12" class="card-warn"/>
  <text x="190" y="345" class="inner-text" fill="#ef4444">HARD CONSTRAINT</text>
  <text x="190" y="370" class="inner-text">Write: .omo/*.md ONLY</text>

  <path d="M 190 390 L 190 430" class="spine" marker-end="url(#arrow)"/>

  <rect x="60" y="430" width="260" height="60" rx="8" class="inner-card"/>
  <text x="190" y="465" class="inner-text">Output: Plan File</text>

  <!-- Transition 1 -->
  <path d="M 320 230 L 370 230" class="spine" marker-end="url(#arrow)"/>
  <text x="345" y="220" class="arrow-text">/start</text>

  <!-- Column 2: EXECUTE -->
  <text x="500" y="160" class="card-title" fill="#8b9eb3">2. EXECUTE PHASE</text>

  <rect x="370" y="190" width="260" height="80" rx="12" class="card-highlight"/>
  <text x="500" y="230" class="card-title">Execute Worker</text>
  <text x="500" y="255" class="inner-text">Implements the plan</text>

  <path d="M 500 270 L 500 310" class="spine" marker-end="url(#arrow)"/>

  <rect x="370" y="310" width="260" height="80" rx="12" class="card-warn"/>
  <text x="500" y="345" class="inner-text" fill="#ef4444">HARD CONSTRAINT</text>
  <text x="500" y="370" class="inner-text">Codebase ONLY (No scope)</text>

  <path d="M 500 390 L 500 430" class="spine" marker-end="url(#arrow)"/>

  <rect x="370" y="430" width="260" height="60" rx="8" class="inner-card"/>
  <text x="500" y="465" class="inner-text">Output: Code Changes</text>

  <!-- Transition 2 -->
  <path d="M 630 230 L 680 230" class="spine" marker-end="url(#arrow)"/>
  <text x="655" y="220" class="arrow-text">Submit</text>

  <!-- Column 3: VERIFY -->
  <text x="810" y="160" class="card-title" fill="#8b9eb3">3. VERIFY PHASE</text>

  <rect x="680" y="190" width="260" height="80" rx="12" class="card-async" style="stroke-dasharray: none;"/>
  <text x="810" y="230" class="card-title">Verification Gate</text>
  <text x="810" y="255" class="inner-text">Proves correctness</text>

  <path d="M 810 270 L 810 310" class="spine" marker-end="url(#arrow)"/>

  <rect x="680" y="310" width="260" height="80" rx="12" class="card-warn"/>
  <text x="810" y="345" class="inner-text" fill="#ef4444">HARD CONSTRAINT</text>
  <text x="810" y="370" class="inner-text">Read / Test (Zero trust)</text>

  <path d="M 810 390 L 810 430" class="spine" marker-end="url(#arrow)"/>

  <rect x="680" y="430" width="260" height="60" rx="8" class="inner-card"/>
  <text x="810" y="465" class="inner-text">Output: Proven Result</text>

</svg>