<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Subagent Isolation Boundaries">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 18px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 13px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }
    
    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .card-warn { fill: rgba(239,68,68,0.08); stroke: rgba(239,68,68,0.3); stroke-width: 1.5; }
    .card-core { fill: rgba(168,85,247,0.08); stroke: rgba(168,85,247,0.4); stroke-width: 2; }
    
    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-warn { fill: none; stroke: rgba(239,68,68,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(239,68,68,0.8)"/>
    </marker>
  </defs>

  <rect width="1000" height="600" fill="url(#bg)"/>
  <rect width="1000" height="600" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">SUBAGENT ISOLATION BOUNDARIES</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">Four layers of isolation with strict permission derivation to prevent recursive execution</text>

  <!-- Central Core -->
  <rect x="380" y="250" width="240" height="100" rx="16" class="card-core"/>
  <text x="500" y="295" class="card-title" fill="#c084fc">CORE</text>
  <text x="500" y="320" class="inner-text">SUBAGENT PROCESS</text>

  <!-- Top: Permission -->
  <rect x="380" y="130" width="240" height="70" rx="10" class="card-warn"/>
  <text x="500" y="160" class="inner-sub" fill="#ef4444">DERIVED FROM PARENT</text>
  <text x="500" y="180" class="inner-text">PERMISSION (DENY TASK)</text>
  <path d="M 500 200 L 500 240" class="spine" marker-end="url(#arrow)"/>

  <!-- External Attack -->
  <rect x="60" y="135" width="220" height="60" rx="10" class="inner-card" stroke="rgba(239,68,68,0.5)"/>
  <text x="170" y="160" class="inner-sub" fill="#ef4444">EXTERNAL</text>
  <text x="170" y="180" class="inner-text">RECURSIVE TASK CALL</text>
  
  <path d="M 280 165 L 365 165" class="spine-warn" marker-end="url(#arrow-warn)"/>
  <text x="325" y="155" class="arrow-text" fill="#ef4444">BLOCKED</text>

  <!-- Left: Prompt -->
  <rect x="60" y="265" width="240" height="70" rx="10" class="card-highlight"/>
  <text x="180" y="295" class="inner-sub" fill="#58a6ff">ISOLATED PERSONA</text>
  <text x="180" y="315" class="inner-text">PROMPT</text>
  <path d="M 300 300 L 370 300" class="spine" marker-end="url(#arrow)"/>

  <!-- Right: Model -->
  <rect x="700" y="265" width="240" height="70" rx="10" class="card-highlight"/>
  <text x="820" y="295" class="inner-sub" fill="#58a6ff">COST TIER ROUTING</text>
  <text x="820" y="315" class="inner-text">MODEL</text>
  <path d="M 700 300 L 630 300" class="spine" marker-end="url(#arrow)"/>

  <!-- Bottom: Steps -->
  <rect x="380" y="400" width="240" height="70" rx="10" class="card-highlight"/>
  <text x="500" y="430" class="inner-sub" fill="#58a6ff">EXECUTION LIMIT</text>
  <text x="500" y="450" class="inner-text">STEPS</text>
  <path d="M 500 400 L 500 360" class="spine" marker-end="url(#arrow)"/>

</svg>
