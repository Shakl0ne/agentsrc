<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Scheduling Comparison">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 13px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }
    
    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .card-async { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; stroke-dasharray: 4 4; }
    
    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 6 6; }
    .spine-gray { fill: none; stroke: rgba(139,158,179,0.5); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(63,185,80,0.8)"/>
    </marker>
  </defs>

  <rect width="1000" height="600" fill="url(#bg)"/>
  <rect width="1000" height="600" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">SCHEDULING COMPARISON</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">Serial Queue vs. Parallel Coordinator</text>

  <!-- Left: Serial Queue -->
  <rect x="80" y="140" width="380" height="420" rx="16" class="card"/>
  <text x="270" y="180" class="card-title" text-anchor="middle">Serial Queue</text>
  <text x="270" y="200" class="inner-sub" fill="#8b9eb3">OpenCode / Traditional</text>

  <rect x="170" y="230" width="200" height="50" rx="8" class="inner-card"/>
  <text x="270" y="260" class="inner-text">TASK A</text>
  
  <path d="M 270 280 L 270 310" class="spine" marker-end="url(#arrow)"/>

  <rect x="170" y="310" width="200" height="50" rx="8" class="inner-card"/>
  <text x="270" y="340" class="inner-text">TASK B</text>

  <path d="M 270 360 L 270 390" class="spine" marker-end="url(#arrow)"/>

  <rect x="170" y="390" width="200" height="50" rx="8" class="inner-card"/>
  <text x="270" y="420" class="inner-text">TASK C</text>

  <path d="M 270 440 L 270 470" class="spine" marker-end="url(#arrow)"/>

  <rect x="170" y="470" width="200" height="60" rx="8" class="card-highlight"/>
  <text x="270" y="505" class="inner-text" fill="#58a6ff">SINGLE HANDLER</text>

  <!-- Right: Parallel Coordinator -->
  <rect x="540" y="140" width="380" height="420" rx="16" class="card"/>
  <text x="730" y="180" class="card-title" text-anchor="middle">Parallel Coordinator</text>
  <text x="730" y="200" class="inner-sub" fill="#8b9eb3">Claude Code / Advanced</text>

  <rect x="630" y="230" width="200" height="60" rx="8" class="card-highlight"/>
  <text x="730" y="265" class="inner-text" fill="#58a6ff">COORDINATOR</text>

  <path d="M 730 290 L 630 390" class="spine-async" marker-end="url(#arrow-async)"/>
  <path d="M 730 290 L 730 390" class="spine-async" marker-end="url(#arrow-async)"/>
  <path d="M 730 290 L 850 390" class="spine-async" marker-end="url(#arrow-async)"/>

  <rect x="560" y="390" width="100" height="50" rx="8" class="card-async"/>
  <text x="610" y="420" class="inner-text" fill="#3fb950">WORKER A</text>

  <rect x="680" y="390" width="100" height="50" rx="8" class="card-async"/>
  <text x="730" y="420" class="inner-text" fill="#3fb950">WORKER B</text>

  <rect x="800" y="390" width="100" height="50" rx="8" class="card-async"/>
  <text x="850" y="420" class="inner-text" fill="#3fb950">WORKER C</text>

</svg>
