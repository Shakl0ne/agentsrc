<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Core and Extensions">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 38px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #b7c3d2; }
    .core-title { font-size: 34px; font-weight: 700; fill: #f0f6fc; }
    .core-meta { font-size: 20px; font-weight: 500; fill: #d2dbe5; }
    .node-title { font-size: 24px; font-weight: 700; fill: #f0f6fc; }
    .node-meta { font-size: 18px; font-weight: 500; fill: #d2dbe5; }
    .card { fill: rgba(255,255,255,0.07); stroke: rgba(255,255,255,0.17); stroke-width: 2; }
    .core { fill: rgba(255,255,255,0.09); stroke: rgba(255,255,255,0.22); stroke-width: 2.2; }
    .card-line { stroke: rgba(255,255,255,0.24); stroke-width: 1.2; }
    .attach { fill: none; stroke: rgba(125,196,255,0.58); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .attach-soft { fill: none; stroke: rgba(125,196,255,0.18); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .halo-top { fill: rgba(188,140,255,0.05); }
    .halo-bottom { fill: rgba(63,185,80,0.05); }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="20%" cy="25%" r="32%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="24%" r="28%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="52%" cy="86%" r="30%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrowHead" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#7dc4ff"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="url(#bg)"/>
  <rect width="1200" height="820" fill="url(#grid)"/>
  <rect width="1200" height="820" fill="url(#glowBlue)"/>
  <rect width="1200" height="820" fill="url(#glowPurple)"/>
  <rect width="1200" height="820" fill="url(#glowGreen)"/>

  <text x="600" y="70" text-anchor="middle" class="title">Core and Extensions</text>
  <text x="600" y="104" text-anchor="middle" class="subtitle">capabilities attach around a stable core</text>

  <ellipse cx="600" cy="214" rx="390" ry="90" class="halo-top" data-graph-role="decoration"/>
  <ellipse cx="600" cy="626" rx="390" ry="90" class="halo-bottom" data-graph-role="decoration"/>

  <g>
    <rect x="350" y="280" width="500" height="250" rx="34" class="core"/>
    <line x1="388" y1="314" x2="812" y2="314" class="card-line"/>
    <text x="600" y="404" text-anchor="middle" class="core-title">Runtime Core</text>
    <text x="600" y="448" text-anchor="middle" class="core-meta">session · tool · model</text>
  </g>

  <g>
    <rect x="140" y="160" width="220" height="104" rx="26" class="card"/>
    <text x="250" y="210" text-anchor="middle" class="node-title">Plugin</text>
    <text x="250" y="242" text-anchor="middle" class="node-meta">custom hooks</text>
  </g>
  <g>
    <rect x="490" y="108" width="220" height="104" rx="26" class="card"/>
    <text x="600" y="158" text-anchor="middle" class="node-title">MCP</text>
    <text x="600" y="190" text-anchor="middle" class="node-meta">external tools</text>
  </g>
  <g>
    <rect x="840" y="160" width="220" height="104" rx="26" class="card"/>
    <text x="950" y="210" text-anchor="middle" class="node-title">Skill</text>
    <text x="950" y="242" text-anchor="middle" class="node-meta">reusable prompts</text>
  </g>
  <g>
    <rect x="140" y="556" width="220" height="104" rx="26" class="card"/>
    <text x="250" y="606" text-anchor="middle" class="node-title">Permission</text>
    <text x="250" y="638" text-anchor="middle" class="node-meta">execution gate</text>
  </g>
  <g>
    <rect x="490" y="608" width="220" height="104" rx="26" class="card"/>
    <text x="600" y="658" text-anchor="middle" class="node-title">Snapshot</text>
    <text x="600" y="690" text-anchor="middle" class="node-meta">state capture</text>
  </g>
  <g>
    <rect x="840" y="556" width="220" height="104" rx="26" class="card"/>
    <text x="950" y="606" text-anchor="middle" class="node-title">Background</text>
    <text x="950" y="638" text-anchor="middle" class="node-meta">async work</text>
  </g>

  <path d="M250 270 C250 294 294 314 350 330" class="attach-soft"/>
  <path d="M600 212 L600 280" class="attach-soft"/>
  <path d="M950 270 C950 294 906 314 850 330" class="attach-soft"/>
  <path d="M250 548 C250 524 294 500 350 480" class="attach-soft"/>
  <path d="M600 608 L600 530" class="attach-soft"/>
  <path d="M950 548 C950 524 906 500 850 480" class="attach-soft"/>

  <path d="M250 270 C250 294 294 314 350 330" class="attach" marker-end="url(#arrowHead)"/>
  <path d="M600 212 L600 280" class="attach" marker-end="url(#arrowHead)"/>
  <path d="M950 270 C950 294 906 314 850 330" class="attach" marker-end="url(#arrowHead)"/>
  <path d="M250 548 C250 524 294 500 350 480" class="attach" marker-end="url(#arrowHead)"/>
  <path d="M600 608 L600 530" class="attach" marker-end="url(#arrowHead)"/>
  <path d="M950 548 C950 524 906 500 850 480" class="attach" marker-end="url(#arrowHead)"/>
</svg>
