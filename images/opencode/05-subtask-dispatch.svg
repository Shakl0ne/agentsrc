<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="Subtask Dispatch Model">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 13px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }
    
    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .card-async { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; stroke-dasharray: 4 4; }
    
    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 6 6; }
    .spine-gray { fill: none; stroke: rgba(139,158,179,0.5); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(63,185,80,0.8)"/>
    </marker>
  </defs>

  <rect width="1000" height="500" fill="url(#bg)"/>
  <rect width="1000" height="500" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">SUBTASK DISPATCH MODEL</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">Two-phase dispatch mechanism separating prompt formulation from execution</text>

  <!-- Phase 1: Formulation -->
  <rect x="100" y="160" width="350" height="240" rx="16" class="card"/>
  <text x="275" y="195" class="card-title" text-anchor="middle">Phase 1: Formulation</text>
  <text x="275" y="215" class="inner-sub" fill="#8b9eb3">Synchronous Generation</text>

  <rect x="150" y="240" width="250" height="50" rx="8" class="inner-card"/>
  <text x="275" y="270" class="inner-text">LLM TOOL CALL</text>

  <path d="M 275 290 L 275 320" class="spine" marker-end="url(#arrow)"/>

  <rect x="150" y="320" width="250" height="50" rx="8" class="card-highlight"/>
  <text x="275" y="350" class="inner-text" fill="#58a6ff">SUBTASK PART</text>

  <!-- Async Bridge -->
  <path d="M 450 280 L 550 280" class="spine-async" marker-end="url(#arrow-async)"/>
  <text x="500" y="270" class="arrow-text" fill="#3fb950">Async Push</text>

  <!-- Phase 2: Execution -->
  <rect x="550" y="160" width="350" height="240" rx="16" class="card"/>
  <text x="725" y="195" class="card-title" text-anchor="middle">Phase 2: Execution</text>
  <text x="725" y="215" class="inner-sub" fill="#8b9eb3">Asynchronous Processing</text>

  <rect x="600" y="240" width="250" height="50" rx="8" class="inner-card"/>
  <text x="725" y="270" class="inner-text">QUEUE POP()</text>

  <path d="M 725 290 L 725 320" class="spine" marker-end="url(#arrow)"/>

  <rect x="600" y="320" width="250" height="50" rx="8" class="card-async"/>
  <text x="725" y="350" class="inner-text" fill="#3fb950">SUBAGENT EXECUTION</text>

</svg>
