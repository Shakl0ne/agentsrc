<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 720" width="1700" height="720" role="img" aria-label="One Assembly Chain">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 38px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #b7c3d2; }
    .node-title { font-size: 24px; font-weight: 700; fill: #f0f6fc; }
    .node-meta { font-size: 18px; font-weight: 500; fill: #d2dbe5; }
    .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2.2px; fill: #9fb1c8; }
    .support { font-size: 16px; font-weight: 600; letter-spacing: 1.8px; fill: #8fc8ff; }
    .card { fill: rgba(255,255,255,0.07); stroke: rgba(255,255,255,0.17); stroke-width: 2; }
    .card-line { stroke: rgba(255,255,255,0.24); stroke-width: 1.2; }
    .rail { fill: none; stroke: rgba(125,196,255,0.30); stroke-width: 3; stroke-linecap: round; }
    .stem { fill: none; stroke: rgba(125,196,255,0.42); stroke-width: 2.4; stroke-linecap: round; }
    .dot { fill: rgba(125,196,255,0.86); }
    .link { fill: none; stroke: rgba(125,196,255,0.88); stroke-width: 3; stroke-linecap: round; }
    .link-node { fill: rgba(125,196,255,0.90); }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="18%" cy="28%" r="28%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="82%" cy="30%" r="26%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="52%" cy="82%" r="30%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1700" height="720" fill="url(#bg)"/>
  <rect width="1700" height="720" fill="url(#grid)"/>
  <rect width="1700" height="720" fill="url(#glowBlue)"/>
  <rect width="1700" height="720" fill="url(#glowPurple)"/>
  <rect width="1700" height="720" fill="url(#glowGreen)"/>

  <text x="850" y="70" text-anchor="middle" class="title">One Assembly Chain</text>
  <text x="850" y="104" text-anchor="middle" class="subtitle">a single path from entry to growth</text>

  <path d="M80 494 H1620" class="rail"/>
  <circle cx="160" cy="494" r="5" class="dot"/>
  <circle cx="420" cy="494" r="5" class="dot"/>
  <circle cx="680" cy="494" r="5" class="dot"/>
  <circle cx="940" cy="494" r="5" class="dot"/>
  <circle cx="1200" cy="494" r="5" class="dot"/>
  <circle cx="1500" cy="494" r="5" class="dot"/>
  <text x="80" y="530" class="support">SINGLE EXECUTION PATH</text>

  <g>
    <rect x="40" y="262" width="240" height="130" rx="28" class="card"/>
    <rect x="94" y="306" width="14" height="42" rx="7" fill="#58a6ff"/>
    <text x="140" y="304" class="eyebrow">ENTRY</text>
    <text x="140" y="338" class="node-title">Entry</text>
    <text x="140" y="370" class="node-meta">cli / web</text>
    <path d="M160 392 L160 494" class="stem"/>
  </g>

  <g>
    <rect x="300" y="262" width="240" height="130" rx="28" class="card"/>
    <rect x="354" y="306" width="14" height="42" rx="7" fill="#58a6ff"/>
    <text x="400" y="304" class="eyebrow">RUNTIME</text>
    <text x="400" y="338" class="node-title">Runtime</text>
    <text x="400" y="370" class="node-meta">effect runtime</text>
    <path d="M420 392 L420 494" class="stem"/>
  </g>

  <g>
    <rect x="560" y="262" width="240" height="130" rx="28" class="card"/>
    <rect x="614" y="306" width="14" height="42" rx="7" fill="#bc8cff"/>
    <text x="660" y="304" class="eyebrow">SESSION</text>
    <text x="660" y="338" class="node-title">Session</text>
    <text x="660" y="370" class="node-meta">main loop</text>
    <path d="M680 392 L680 494" class="stem"/>
  </g>

  <g>
    <rect x="820" y="262" width="240" height="130" rx="28" class="card"/>
    <rect x="874" y="306" width="14" height="42" rx="7" fill="#bc8cff"/>
    <text x="920" y="304" class="eyebrow">MODEL</text>
    <text x="920" y="338" class="node-title">LLM</text>
    <text x="920" y="370" class="node-meta">provider bridge</text>
    <path d="M940 392 L940 494" class="stem"/>
  </g>

  <g>
    <rect x="1080" y="262" width="240" height="130" rx="28" class="card"/>
    <rect x="1134" y="306" width="14" height="42" rx="7" fill="#3fb950"/>
    <text x="1180" y="304" class="eyebrow">TOOL</text>
    <text x="1180" y="338" class="node-title">Tool</text>
    <text x="1180" y="370" class="node-meta">execution</text>
    <path d="M1200 392 L1200 494" class="stem"/>
  </g>

  <g>
    <rect x="1340" y="262" width="320" height="130" rx="28" class="card"/>
    <rect x="1394" y="306" width="14" height="42" rx="7" fill="#f78166"/>
    <text x="1440" y="304" class="eyebrow">GROWTH</text>
    <text x="1440" y="338" class="node-title">Storage / Extension</text>
    <text x="1440" y="370" class="node-meta">state + growth</text>
    <path d="M1500 392 L1500 494" class="stem"/>
  </g>

  <path d="M280 327 L300 327" class="link"/>
  <path d="M540 327 L560 327" class="link"/>
  <path d="M800 327 L820 327" class="link"/>
  <path d="M1060 327 L1080 327" class="link"/>
  <path d="M1320 327 L1340 327" class="link"/>
  <circle cx="300" cy="327" r="5" class="link-node"/>
  <circle cx="560" cy="327" r="5" class="link-node"/>
  <circle cx="820" cy="327" r="5" class="link-node"/>
  <circle cx="1080" cy="327" r="5" class="link-node"/>
  <circle cx="1340" cy="327" r="5" class="link-node"/>
</svg>
