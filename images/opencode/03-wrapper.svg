<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Tool.wrap() Pipeline">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }
    
    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    
    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .spine-red { fill: none; stroke: rgba(248,81,73,0.6); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .spine-gray { fill: none; stroke: rgba(139,158,179,0.5); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(248,81,73,0.8)"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(139,158,179,0.8)"/>
    </marker>
  </defs>

  <rect width="1000" height="600" fill="url(#bg)"/>
  <rect width="1000" height="600" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">Tool.wrap() Pipeline</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">Validation and Truncation</text>

  <!-- LLM Box -->
  <rect x="50" y="210" width="120" height="80" rx="12" class="inner-card"/>
  <text x="110" y="255" class="card-title" text-anchor="middle">LLM</text>

  <!-- Wrapper Box -->
  <rect x="300" y="140" width="400" height="360" rx="20" class="card" stroke-dasharray="8 8"/>
  <text x="320" y="175" class="card-title" fill="#8b9eb3">Tool.wrap()</text>

  <!-- Stage 1: Decode -->
  <rect x="350" y="200" width="300" height="60" rx="10" class="inner-card"/>
  <text x="500" y="235" class="inner-text">Schema.decodeUnknownEffect</text>

  <!-- Stage 2: Execute -->
  <rect x="350" y="300" width="300" height="60" rx="10" class="card-highlight"/>
  <text x="500" y="335" class="inner-text" fill="#58a6ff">execute()</text>

  <!-- Stage 3: Truncate -->
  <rect x="350" y="400" width="300" height="60" rx="10" class="inner-card"/>
  <text x="500" y="435" class="inner-text">truncate.output()</text>

  <!-- Arrows -->
  <!-- LLM -> Decode -->
  <path d="M 170 230 L 350 230" class="spine" marker-end="url(#arrow)"/>
  <text x="260" y="220" class="arrow-text">JSON Args</text>

  <!-- Decode -> LLM (Error) -->
  <path d="M 350 250 L 170 250" class="spine-red" marker-end="url(#arrow-red)"/>
  <text x="260" y="270" class="arrow-text" fill="#f85149">InvalidArgsError</text>

  <!-- Decode -> Execute -->
  <path d="M 500 260 L 500 300" class="spine-gray" marker-end="url(#arrow-gray)"/>
  <text x="510" y="285" class="arrow-text" text-anchor="start">Valid Typed Object</text>

  <!-- Execute -> Truncate -->
  <path d="M 500 360 L 500 400" class="spine-gray" marker-end="url(#arrow-gray)"/>
  <text x="510" y="385" class="arrow-text" text-anchor="start">Raw Output</text>

  <!-- Truncate -> LLM -->
  <path d="M 350 430 L 110 430 L 110 290" class="spine" marker-end="url(#arrow)"/>
  <text x="230" y="420" class="arrow-text">Truncated Output</text>

  <!-- Truncate -> Disk -->
  <path d="M 650 430 L 800 430" class="spine-gray" marker-end="url(#arrow-gray)"/>
  <rect x="800" y="400" width="140" height="60" rx="10" class="inner-card"/>
  <text x="870" y="435" class="inner-text">Full File on Disk</text>
</svg>