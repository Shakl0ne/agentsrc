<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Context-Aware Injection">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 13px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }

    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .card-async { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .card-warn { fill: rgba(239,68,68,0.08); stroke: rgba(239,68,68,0.3); stroke-width: 1.5; }
    .card-core { fill: rgba(168,85,247,0.08); stroke: rgba(168,85,247,0.4); stroke-width: 2; }

    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-warn { fill: none; stroke: rgba(239,68,68,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(63,185,80,0.8)"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(239,68,68,0.8)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">CONTEXT-AWARE INJECTION</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">Dynamic instruction loading based on directory tree traversal</text>

  <!-- Left Card: LLM Action -->
  <rect x="30" y="390" width="210" height="80" rx="12" class="card-core"/>
  <text x="135" y="430" class="card-title">LLM ACTION</text>
  <text x="135" y="455" class="inner-text">Read("src/auth/utils.ts")</text>

  <!-- Middle Area: File System Box -->
  <rect x="320" y="160" width="390" height="320" rx="12" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="515" y="190" class="inner-text" fill="#8b9eb3">FILE SYSTEM</text>

  <!-- Tree Lines (Drawn behind nodes) -->
  <path d="M 380 246 L 380 278 L 390 278" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <path d="M 410 296 L 410 328 L 420 328" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <path d="M 440 346 L 440 380 L 450 380" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <path d="M 440 380 L 440 430 L 450 430" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Directory Nodes -->
  <rect x="360" y="210" width="180" height="36" rx="6" class="inner-card"/>
  <text x="450" y="234" class="inner-text">📁 / (Root)</text>

  <rect x="390" y="260" width="180" height="36" rx="6" class="inner-card"/>
  <text x="480" y="284" class="inner-text">📁 src/</text>

  <rect x="420" y="310" width="180" height="36" rx="6" class="inner-card"/>
  <text x="510" y="334" class="inner-text">📁 src/auth/</text>

  <!-- File Nodes -->
  <rect x="450" y="362" width="200" height="36" rx="6" class="card-async"/>
  <text x="550" y="386" class="inner-text" fill="#f0f6fc">📄 AGENTS.md (Rules)</text>

  <rect x="450" y="412" width="200" height="36" rx="6" class="card-highlight"/>
  <text x="550" y="436" class="inner-text" fill="#f0f6fc">📄 utils.ts (Target)</text>

  <!-- Right Card: Tool Result -->
  <rect x="750" y="330" width="220" height="130" rx="12" class="card"/>
  <text x="860" y="360" class="card-title">TOOL RESULT</text>
  <text x="860" y="385" class="inner-text" style="fill: #3fb950;">+ &lt;system-reminder&gt;</text>
  <text x="860" y="435" class="inner-text">File Content</text>

  <!-- Main Flow Arrows -->
  <!-- Trigger Arrow -->
  <path d="M 240 430 L 450 430" class="spine" marker-end="url(#arrow)"/>
  <text x="345" y="420" class="arrow-text">Triggers</text>

  <!-- Injects Arrow (AGENTS.md -> Result) -->
  <path d="M 650 380 L 750 380" class="spine-async" marker-end="url(#arrow-async)"/>
  <text x="700" y="370" class="arrow-text" style="fill: #3fb950;">Injects</text>

  <!-- Returns Arrow (utils.ts -> Result) -->
  <path d="M 650 430 L 750 430" class="spine" marker-end="url(#arrow)"/>
  <text x="700" y="420" class="arrow-text">Returns</text>

</svg>