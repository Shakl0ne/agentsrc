<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="Compaction lock in the log">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 36px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 16px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .card-lock { fill: rgba(168,85,247,0.1); stroke: rgba(168,85,247,0.4); stroke-width: 2; }
    .card-replace { fill: rgba(88,166,255,0.1); stroke: rgba(88,166,255,0.4); stroke-width: 2; }
    .spine { fill: none; stroke: rgba(125,196,255,0.4); stroke-width: 2.5; stroke-linecap: round; }
    .label-purple { font-size: 16px; font-weight: 700; fill: #d2a8ff; text-anchor: middle; }
    .label-red { font-size: 16px; font-weight: 700; fill: #ff7b72; text-anchor: middle; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="500" y="52" text-anchor="middle" class="title">THE LOCK LIVES IN THE LOG</text>
  <text x="500" y="84" text-anchor="middle" class="subtitle">start → summary → end, end released last</text>

  <!-- log rail -->
  <path d="M60 220 L940 220" class="spine"/>

  <!-- events on rail -->
  <rect x="60" y="188" width="120" height="64" rx="10" class="card"/>
  <text x="120" y="216" class="card-title">events</text>
  <text x="120" y="240" class="inner-sub">log-only</text>

  <rect x="212" y="180" width="200" height="80" rx="10" class="card-lock"/>
  <text x="312" y="212" class="card-title">compaction/start</text>
  <text x="312" y="238" class="label-purple">LOCK</text>

  <rect x="444" y="188" width="132" height="64" rx="10" class="card"/>
  <text x="510" y="216" class="card-title">summarize</text>
  <text x="510" y="240" class="inner-sub">ctx.llm call</text>

  <rect x="608" y="180" width="228" height="80" rx="10" class="card"/>
  <text x="722" y="212" class="card-title">compaction/summary</text>
  <text x="722" y="238" class="inner-sub">range · tokens · model</text>

  <rect x="868" y="188" width="120" height="64" rx="10" class="card-lock"/>
  <text x="928" y="216" class="card-title">end</text>
  <text x="928" y="240" class="label-purple">RELEASE</text>

  <!-- summary card below start -->
  <rect x="212" y="310" width="300" height="64" rx="10" class="card-replace"/>
  <text x="362" y="338" class="card-title">user/message</text>
  <text x="362" y="362" class="inner-sub">surfaceOp: replace</text>
  <path d="M312 260 L312 306" class="spine"/>

  <!-- arrow from summary to end -->
  <path d="M836 220 C 846 220, 856 220, 864 220" class="spine"/>

  <!-- crash annotation -->
  <path d="M950 220 C 940 130, 860 120, 760 132" stroke="rgba(239,68,68,0.55)" stroke-width="2.5" fill="none" stroke-dasharray="7 7"/>
  <text x="830" y="112" class="label-red">crash here</text>

  <rect x="540" y="410" width="420" height="64" rx="12" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.3)" stroke-width="1.5"/>
  <text x="750" y="436" class="card-title">orphaned lock</text>
  <text x="750" y="460" class="inner-sub">start without end</text>

  <path d="M380 410 C 420 380, 440 320, 470 266" stroke="rgba(239,68,68,0.5)" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
</svg>
