<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img" aria-label="One inbox, three inputs">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 36px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 16px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 16px; font-weight: 700; fill: #9fb1c8; text-anchor: middle; }
    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.35); stroke-width: 2; }
    .card-async { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
    .spine-soft { fill: none; stroke: rgba(63,185,80,0.5); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 6 6; marker-end: url(#arrow-green); }
    .tag { font-size: 16px; font-weight: 700; fill: #7ee2a8; text-anchor: middle; }
    .tag-off { font-size: 16px; font-weight: 700; fill: #f0a6a0; text-anchor: middle; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(63,185,80,0.7)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="500" y="52" text-anchor="middle" class="title">ONE INBOX, THREE INPUTS</text>
  <text x="500" y="84" text-anchor="middle" class="subtitle">Three inputs, one inbox</text>

  <!-- followup -->
  <rect x="40" y="140" width="260" height="90" rx="12" class="card"/>
  <text x="170" y="176" class="card-title">followup()</text>
  <text x="170" y="210" class="tag">wakes driver</text>

  <!-- steer -->
  <rect x="40" y="264" width="260" height="90" rx="12" class="card"/>
  <text x="170" y="300" class="card-title">steer()</text>
  <text x="170" y="334" class="tag">wakes driver</text>

  <!-- inject -->
  <rect x="40" y="388" width="260" height="90" rx="12" class="card-async"/>
  <text x="170" y="424" class="card-title">inject()</text>
  <text x="170" y="458" class="tag-off">no wake</text>

  <!-- arrows: inputs → inbox -->
  <path d="M300 185 C 370 185, 380 230, 426 260" class="spine"/>
  <path d="M300 309 C 370 309, 380 290, 426 280" class="spine"/>
  <path d="M300 433 C 370 433, 380 330, 426 300" class="spine-soft"/>

  <!-- inbox -->
  <rect x="430" y="180" width="250" height="220" rx="12" class="card-highlight"/>
  <text x="555" y="214" class="card-title">INBOX</text>
  <text x="555" y="262" class="inner-text">next-turn</text>
  <text x="555" y="308" class="inner-text">next-step</text>

  <!-- claim arrow -->
  <path d="M680 290 L746 290" class="spine"/>
  <text x="713" y="274" class="arrow-text">claim()</text>

  <!-- driver -->
  <rect x="750" y="180" width="220" height="180" rx="12" class="card"/>
  <text x="860" y="220" class="card-title">DRIVER</text>
  <text x="860" y="254" class="inner-sub">claims all next-step</text>
  <text x="860" y="280" class="inner-sub">+ one next-turn</text>

</svg>
