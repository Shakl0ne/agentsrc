<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-label="One plugin tree assembled into six product surfaces">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 36px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 16px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .prod-name { font-size: 20px; font-weight: 700; fill: #f0f6fc; }
    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.35); stroke-width: 2; }
    .card-warn { fill: rgba(239,68,68,0.08); stroke: rgba(239,68,68,0.35); stroke-width: 1.5; }
    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
    .label-dim { font-size: 16px; font-weight: 500; fill: #6e7a88; text-anchor: middle; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="52" text-anchor="middle" class="title">ONE TREE, MANY PRODUCTS</text>
  <text x="500" y="84" text-anchor="middle" class="subtitle">Same plugin tree assembles into six product forms</text>

  <!-- Root node -->
  <rect x="50" y="170" width="190" height="80" rx="12" class="card"/>
  <text x="145" y="204" class="card-title">EMPTY ROOT</text>
  <text x="145" y="230" class="inner-sub">starts blank</text>

  <!-- Arrow: root → base -->
  <path d="M240 210 L292 210" class="spine"/>

  <!-- Base bundle (hub) -->
  <rect x="310" y="140" width="260" height="140" rx="12" class="card-highlight"/>
  <text x="440" y="180" class="card-title">dsh-base</text>
  <text x="440" y="206" class="inner-sub">shared services</text>
  <text x="440" y="244" class="inner-sub">+ app bundle →</text>

  <!-- Curved arrows: base → products -->
  <path d="M570 175 C 630 175, 640 146, 672 146" class="spine"/>
  <path d="M570 195 C 630 195, 640 226, 672 226" class="spine"/>
  <path d="M570 215 C 630 215, 640 306, 672 306" class="spine"/>
  <path d="M570 235 C 630 235, 640 386, 672 386" class="spine"/>
  <path d="M570 255 C 630 255, 640 466, 672 466" class="spine"/>
  <path d="M570 275 C 640 275, 650 546, 672 546" class="spine"/>

  <!-- Product cards (right column) -->
  <rect x="690" y="116" width="270" height="60" rx="10" class="card"/>
  <text x="722" y="143" class="prod-name" text-anchor="start">web</text>
  <text x="722" y="165" class="inner-sub" style="text-anchor:start">browser UI</text>

  <rect x="690" y="196" width="270" height="60" rx="10" class="card"/>
  <text x="722" y="223" class="prod-name" text-anchor="start">headless</text>
  <text x="722" y="245" class="inner-sub" style="text-anchor:start">CLI runner</text>

  <rect x="690" y="276" width="270" height="60" rx="10" class="card"/>
  <text x="722" y="303" class="prod-name" text-anchor="start">sdk</text>
  <text x="722" y="325" class="inner-sub" style="text-anchor:start">JSON-RPC server</text>

  <rect x="690" y="356" width="270" height="60" rx="10" class="card"/>
  <text x="722" y="383" class="prod-name" text-anchor="start">acp</text>
  <text x="722" y="405" class="inner-sub" style="text-anchor:start">automation</text>

  <rect x="690" y="436" width="270" height="60" rx="10" class="card"/>
  <text x="722" y="463" class="prod-name" text-anchor="start">desktop</text>
  <text x="722" y="485" class="inner-sub" style="text-anchor:start">Electron shell</text>

  <rect x="690" y="516" width="270" height="60" rx="10" class="card-warn"/>
  <text x="722" y="543" class="prod-name" text-anchor="start">sdk-minimal</text>
  <text x="722" y="565" class="inner-sub" style="text-anchor:start">no base · standalone</text>

  <!-- Group label -->
  <text x="690" y="108" style="text-anchor:start" class="label-dim">product surfaces</text>
</svg>
