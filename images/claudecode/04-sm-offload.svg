<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Session memory moves LLM cost off the compaction critical path">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 36px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #b7c3d2; }
    .lane-label { font-size: 16px; font-weight: 700; fill: #3fb950; letter-spacing: 2px; }
    .lane-label-2 { font-size: 16px; font-weight: 700; fill: #d2dbe5; letter-spacing: 2px; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .card-sub { font-size: 16px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .turn { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .pill-text { font-size: 16px; font-weight: 700; fill: #3fb950; text-anchor: middle; }
    .badge { font-size: 16px; font-weight: 700; fill: #ef5b5b; text-anchor: middle; }
    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.12); stroke-width: 2; }
    .card-green { fill: rgba(63,185,80,0.10); stroke: rgba(63,185,80,0.55); stroke-width: 2; }
    .card-ghost { fill: rgba(255,255,255,0.02); stroke: rgba(255,255,255,0.15); stroke-width: 2; stroke-dasharray: 5 4; opacity: 0.6; }
    .card-core { fill: rgba(168,85,247,0.10); stroke: rgba(168,85,247,0.5); stroke-width: 2; }
    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 6 6; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="15" markerHeight="15" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.7)"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="15" markerHeight="15" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(63,185,80,0.8)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="600" y="64" text-anchor="middle" class="title">Session Memory · Cost Off the Critical Path</text>
  <text x="600" y="102" text-anchor="middle" class="subtitle">summarization runs in background during the chat — compaction only reads the file</text>

  <!-- lane 1: conversation -->
  <text x="100" y="188" class="lane-label">DURING CONVERSATION · BACKGROUND</text>

  <rect x="100" y="210" width="150" height="54" rx="10" class="card"/>
  <text x="175" y="243" class="turn">TURN 1</text>
  <rect x="320" y="210" width="150" height="54" rx="10" class="card"/>
  <text x="395" y="243" class="turn">TURN 2</text>
  <rect x="540" y="210" width="150" height="54" rx="10" class="card"/>
  <text x="615" y="243" class="turn">TURN 3</text>
  <rect x="760" y="210" width="150" height="54" rx="10" class="card"/>
  <text x="835" y="243" class="turn">TURN 4</text>
  <rect x="980" y="210" width="150" height="54" rx="10" class="card"/>
  <text x="1055" y="243" class="turn">TURN 5</text>

  <path d="M254 237 L314 237" class="spine" marker-end="url(#arrow)"/>
  <path d="M474 237 L534 237" class="spine" marker-end="url(#arrow)"/>
  <path d="M694 237 L754 237" class="spine" marker-end="url(#arrow)"/>
  <path d="M914 237 L974 237" class="spine" marker-end="url(#arrow)"/>

  <!-- extraction rail -->
  <line x1="285" y1="268" x2="285" y2="311" stroke="rgba(63,185,80,0.4)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="585" y1="268" x2="585" y2="311" stroke="rgba(63,185,80,0.4)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="885" y1="268" x2="885" y2="311" stroke="rgba(63,185,80,0.4)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M130 330 H1100" class="spine-async"/>
  <rect x="210" y="313" width="150" height="34" rx="17" fill="#161b22" stroke="rgba(63,185,80,0.6)" stroke-width="1.5"/>
  <text x="285" y="336" class="pill-text">EXTRACT</text>
  <rect x="510" y="313" width="150" height="34" rx="17" fill="#161b22" stroke="rgba(63,185,80,0.6)" stroke-width="1.5"/>
  <text x="585" y="336" class="pill-text">EXTRACT</text>
  <rect x="810" y="313" width="150" height="34" rx="17" fill="#161b22" stroke="rgba(63,185,80,0.6)" stroke-width="1.5"/>
  <text x="885" y="336" class="pill-text">EXTRACT</text>

  <!-- bridge: the memory file -->
  <path d="M585 347 L585 376" class="spine-async" marker-end="url(#arrow-async)"/>
  <rect x="480" y="380" width="240" height="64" rx="12" class="card-core"/>
  <text x="600" y="418" class="card-title">SESSION MEMORY FILE</text>

  <!-- lane 2: compaction time -->
  <text x="100" y="505" class="lane-label-2">AT COMPACTION TIME</text>

  <path d="M600 444 L472 518" class="spine-async" marker-end="url(#arrow-async)"/>

  <rect x="320" y="522" width="300" height="102" rx="12" class="card-green"/>
  <text x="470" y="572" class="card-title">READ FILE</text>
  <text x="470" y="604" class="card-sub">≈ ms · zero LLM calls</text>

  <rect x="660" y="522" width="300" height="102" rx="12" class="card-ghost"/>
  <rect x="765" y="536" width="90" height="26" rx="13" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.5)" stroke-width="1.5"/>
  <text x="810" y="555" class="badge">SKIPPED</text>
  <text x="810" y="584" class="card-title">LLM SUMMARY</text>
  <line x1="745" y1="577" x2="875" y2="577" stroke="rgba(239,68,68,0.7)" stroke-width="2.5"/>
  <text x="810" y="614" class="card-sub">≈ seconds · fallback only</text>
</svg>
