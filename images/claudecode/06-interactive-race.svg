<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Permission dialog: five-way race for the first response">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 36px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #c9d5e3; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .card-sub { font-size: 17px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .footer { font-size: 17px; font-weight: 500; fill: #6e8296; text-anchor: middle; }
    .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.6); stroke-width: 4; }
    .card-blue { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.45); stroke-width: 2; }
    .card-green { fill: rgba(63,185,80,0.10); stroke: rgba(63,185,80,0.5); stroke-width: 2; }
    .card-purple { fill: rgba(168,85,247,0.08); stroke: rgba(168,85,247,0.45); stroke-width: 2; }
    .card-amber { fill: rgba(210,153,34,0.10); stroke: rgba(210,153,34,0.45); stroke-width: 2; }
    .card-dash { fill: rgba(210,153,34,0.06); stroke: rgba(210,153,34,0.4); stroke-width: 2; stroke-dasharray: 6 5; }
    .spine { fill: none; stroke: rgba(125,196,255,0.65); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="15" markerHeight="15" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.7)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="600" y="64" text-anchor="middle" class="title">Permission Dialog · Five-Way Race</text>
  <text x="600" y="102" text-anchor="middle" class="subtitle">whoever responds first wins — claim() closes the race window</text>

  <!-- classifier: speculative, dashed -->
  <rect x="440" y="120" width="320" height="100" rx="14" class="card-dash"/>
  <text x="600" y="160" class="card-title">CLASSIFIER</text>
  <text x="600" y="192" class="card-sub">speculative check · 2s budget</text>

  <!-- keyboard: local -->
  <rect x="60" y="260" width="320" height="100" rx="14" class="card-blue"/>
  <text x="220" y="300" class="card-title">KEYBOARD</text>
  <text x="220" y="332" class="card-sub">local terminal input</text>

  <!-- bridge: web -->
  <rect x="820" y="260" width="320" height="100" rx="14" class="card-green"/>
  <text x="980" y="300" class="card-title">BRIDGE &#183; WEB</text>
  <text x="980" y="332" class="card-sub">claude.ai modal &#183; returns updatedInput</text>

  <!-- dialog: the hub -->
  <rect x="460" y="270" width="280" height="120" rx="16" class="card"/>
  <text x="600" y="315" class="card-title">PERMISSION DIALOG</text>
  <text x="600" y="350" class="card-sub">waiting for the first response</text>

  <!-- hook: auto -->
  <rect x="200" y="440" width="280" height="100" rx="14" class="card-amber"/>
  <text x="340" y="480" class="card-title">HOOK</text>
  <text x="340" y="512" class="card-sub">PreToolUse auto-decision</text>

  <!-- channel: IM relay -->
  <rect x="720" y="440" width="280" height="100" rx="14" class="card-purple"/>
  <text x="860" y="480" class="card-title">CHANNEL &#183; IM</text>
  <text x="860" y="512" class="card-sub">Telegram / iMessage &#183; pure yes/no</text>

  <!-- race arrows into the dialog -->
  <path d="M600 220 L600 266" class="spine" marker-end="url(#arrow)"/>
  <path d="M380 310 L456 310" class="spine" marker-end="url(#arrow)"/>
  <path d="M820 310 L744 310" class="spine" marker-end="url(#arrow)"/>
  <path d="M420 440 L452 360" class="spine" marker-end="url(#arrow)"/>
  <path d="M780 440 L748 360" class="spine" marker-end="url(#arrow)"/>

  <text x="600" y="600" class="footer">claim() is an atomic check-and-mark — losers return instantly, pending remote requests cancel</text>
</svg>
