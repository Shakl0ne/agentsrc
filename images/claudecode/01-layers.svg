<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Four Layer Architecture">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 38px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #b7c3d2; }
    .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2.4px; fill: #9fb1c8; }
    .card-title { font-size: 30px; font-weight: 700; fill: #f0f6fc; }
    .card-meta { font-size: 18px; font-weight: 500; fill: #d2dbe5; }
    .card { fill: rgba(255,255,255,0.07); stroke: rgba(255,255,255,0.17); stroke-width: 2; }
    .spine { fill: none; stroke: rgba(125,196,255,0.62); stroke-width: 3; stroke-linecap: round; }
    .spine-soft { fill: none; stroke: rgba(125,196,255,0.18); stroke-width: 10; stroke-linecap: round; }
    .rail { fill: rgba(188,140,255,0.10); stroke: rgba(188,140,255,0.4); stroke-width: 2; stroke-dasharray: 6 6; }
    .rail-text { font-size: 17px; font-weight: 700; letter-spacing: 2.4px; fill: #bc8cff; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="22%" cy="22%" r="36%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="74%" cy="40%" r="32%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="48%" cy="88%" r="34%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.75)"/>
    </marker>
    <radialGradient id="fieldBlue" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fieldPurple" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fieldGreen" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fieldOrange" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#f0883e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f0883e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="820" fill="url(#bg)"/>
  <rect width="1200" height="820" fill="url(#grid)"/>
  <rect width="1200" height="820" fill="url(#glowBlue)"/>
  <rect width="1200" height="820" fill="url(#glowPurple)"/>
  <rect width="1200" height="820" fill="url(#glowGreen)"/>

  <text x="600" y="70" text-anchor="middle" class="title">Four Layers, One Direction</text>
  <text x="600" y="104" text-anchor="middle" class="subtitle">dependencies flow downward, never back up</text>

  <!-- dependency connectors: presentation -> business -> services -> infrastructure -->
  <path d="M600 290 L600 297" class="spine-soft"/>
  <path d="M600 445 L600 452" class="spine-soft"/>
  <path d="M600 600 L600 607" class="spine-soft"/>
  <path d="M600 290 L600 311" class="spine" marker-end="url(#arrow)"/>
  <path d="M600 445 L600 466" class="spine" marker-end="url(#arrow)"/>
  <path d="M600 600 L600 621" class="spine" marker-end="url(#arrow)"/>

  <!-- layer 1: presentation -->
  <g>
    <rect x="200" y="152" width="780" height="138" rx="28" fill="url(#fieldBlue)"/>
    <rect x="215" y="160" width="760" height="130" rx="28" class="card"/>
    <rect x="263" y="202" width="14" height="52" rx="7" fill="#58a6ff"/>
    <text x="315" y="196" class="eyebrow">LAYER 1</text>
    <text x="315" y="229" class="card-title">Presentation</text>
    <text x="315" y="263" class="card-meta">screens/ · ink/ · components/</text>
  </g>

  <!-- layer 2: business logic -->
  <g>
    <rect x="200" y="307" width="780" height="138" rx="28" fill="url(#fieldPurple)"/>
    <rect x="215" y="315" width="760" height="130" rx="28" class="card"/>
    <rect x="263" y="357" width="14" height="52" rx="7" fill="#bc8cff"/>
    <text x="315" y="351" class="eyebrow">LAYER 2</text>
    <text x="315" y="384" class="card-title">Business Logic</text>
    <text x="315" y="418" class="card-meta">QueryEngine.ts · commands.ts · tools/</text>
  </g>

  <!-- layer 3: services -->
  <g>
    <rect x="200" y="462" width="780" height="138" rx="28" fill="url(#fieldGreen)"/>
    <rect x="215" y="470" width="760" height="130" rx="28" class="card"/>
    <rect x="263" y="512" width="14" height="52" rx="7" fill="#3fb950"/>
    <text x="315" y="506" class="eyebrow">LAYER 3</text>
    <text x="315" y="539" class="card-title">Services</text>
    <text x="315" y="573" class="card-meta">api · mcp · lsp</text>
  </g>

  <!-- layer 4: infrastructure -->
  <g>
    <rect x="200" y="617" width="780" height="138" rx="28" fill="url(#fieldOrange)"/>
    <rect x="215" y="625" width="760" height="130" rx="28" class="card"/>
    <rect x="263" y="667" width="14" height="52" rx="7" fill="#f0883e"/>
    <text x="315" y="661" class="eyebrow">LAYER 4</text>
    <text x="315" y="694" class="card-title">Infrastructure</text>
    <text x="315" y="728" class="card-meta">state/ · memdir/ · utils/</text>
  </g>

  <!-- hooks cross-cutting rail -->
  <rect x="1020" y="160" width="24" height="595" rx="12" class="rail"/>
  <text x="1078" y="457" text-anchor="middle" class="rail-text" transform="rotate(-90 1078 457)">hooks/ · CROSS-CUTTING</text>
</svg>
