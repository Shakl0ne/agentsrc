<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 终端窗口外框 -->
  <rect x="3" y="5" width="26" height="22" rx="3" fill="#0d1b2a" stroke="#00D4FF" stroke-width="2"/>
  <!-- 扫描光束（半透明高亮区域） -->
  <rect x="7" y="14" width="12" height="6" rx="1.5" fill="#00D4FF" opacity="0.15"/>
  <!-- 第1行代码（暗色） -->
  <line x1="8" y1="12" x2="18" y2="12" stroke="#2a4a6a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 第2行代码（被扫描的活跃行，亮色） -->
  <line x1="8" y1="16" x2="16" y2="16" stroke="#00D4FF" stroke-width="2" stroke-linecap="round"/>
  <!-- 第3行代码（暗色） -->
  <line x1="8" y1="20" x2="22" y2="20" stroke="#2a4a6a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 扫描状态指示灯（琥珀色小圆点） -->
  <circle cx="26" cy="8" r="2" fill="#FFB347"/>
</svg>
