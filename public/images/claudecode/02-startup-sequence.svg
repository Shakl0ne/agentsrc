<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Claude Code startup sequence: serial assembly line with parallel IO prefetch and async MCP">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 36px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-sub { font-size: 17px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .step-label { font-size: 18px; font-weight: 600; fill: #8b9eb3; text-anchor: middle; letter-spacing: 2px; }
    .legend-text { font-size: 17px; font-weight: 500; fill: #8b9eb3; }
    .async-label { font-size: 16px; font-weight: 700; fill: #3fb950; letter-spacing: 3px; }
    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .card-async { fill: rgba(63,185,80,0.10); stroke: rgba(63,185,80,0.55); stroke-width: 2; stroke-dasharray: 5 4; }
    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 2.5; stroke-dasharray: 6 6; stroke-linecap: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="15" markerHeight="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.7)"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="15" markerHeight="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(63,185,80,0.8)"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- title -->
  <text x="600" y="64" text-anchor="middle" class="title">Claude Code Startup Sequence</text>
  <text x="600" y="102" text-anchor="middle" class="subtitle">Serial assembly · parallel prefetch · async MCP</text>

  <!-- parallel IO prefetch band (async exception 1) -->
  <text x="72" y="158" class="async-label">ASYNC</text>
  <rect x="60" y="170" width="340" height="100" rx="12" class="card-async"/>
  <text x="230" y="212" text-anchor="middle" class="card-title">PARALLEL IO PREFETCH</text>
  <text x="230" y="244" text-anchor="middle" class="inner-sub">keychain + MDM · ~65ms saved</text>
  <path d="M380 270 Q460 320 478 376" class="spine-async" marker-end="url(#arrow-async)"/>

  <!-- main serial rail -->
  <text x="135" y="362" text-anchor="middle" class="step-label">01</text>
  <rect x="60" y="380" width="150" height="110" rx="10" class="card"/>
  <text x="135" y="432" text-anchor="middle" class="card-title">PROCESS ENTRY</text>
  <text x="135" y="464" text-anchor="middle" class="inner-sub">IO prefetch fires</text>

  <text x="315" y="362" text-anchor="middle" class="step-label">02</text>
  <rect x="240" y="380" width="150" height="110" rx="10" class="card"/>
  <text x="315" y="432" text-anchor="middle" class="card-title">IMPORTS</text>
  <text x="315" y="464" text-anchor="middle" class="inner-sub">~135ms · CPU-bound</text>

  <text x="495" y="362" text-anchor="middle" class="step-label">03</text>
  <rect x="420" y="380" width="150" height="110" rx="10" class="card"/>
  <text x="495" y="432" text-anchor="middle" class="card-title">CONFIG LOAD</text>
  <text x="495" y="464" text-anchor="middle" class="inner-sub">rc + policy files</text>

  <text x="675" y="362" text-anchor="middle" class="step-label">04</text>
  <rect x="600" y="380" width="150" height="110" rx="10" class="card"/>
  <text x="675" y="432" text-anchor="middle" class="card-title">GETTOOLS()</text>
  <text x="675" y="464" text-anchor="middle" class="inner-sub">40 tools, pre-auth</text>

  <text x="855" y="362" text-anchor="middle" class="step-label">05</text>
  <rect x="780" y="380" width="150" height="110" rx="10" class="card"/>
  <text x="855" y="432" text-anchor="middle" class="card-title">AUTH &amp; SETUP</text>
  <text x="855" y="464" text-anchor="middle" class="inner-sub">flags · plugins</text>

  <text x="1035" y="362" text-anchor="middle" class="step-label">06</text>
  <rect x="960" y="380" width="150" height="110" rx="10" class="card"/>
  <text x="1035" y="432" text-anchor="middle" class="card-title">LAUNCH REPL</text>
  <text x="1035" y="464" text-anchor="middle" class="inner-sub">query() takes over</text>

  <!-- serial connectors -->
  <path d="M210 435 L236 435" class="spine" marker-end="url(#arrow)"/>
  <path d="M390 435 L416 435" class="spine" marker-end="url(#arrow)"/>
  <path d="M570 435 L596 435" class="spine" marker-end="url(#arrow)"/>
  <path d="M750 435 L776 435" class="spine" marker-end="url(#arrow)"/>
  <path d="M930 435 L956 435" class="spine" marker-end="url(#arrow)"/>

  <!-- async MCP lane (async exception 2) -->
  <path d="M1035 490 L1035 584" class="spine-async" marker-end="url(#arrow-async)"/>
  <text x="872" y="578" class="async-label">ASYNC</text>
  <rect x="860" y="590" width="340" height="110" rx="12" class="card-async"/>
  <text x="1030" y="638" text-anchor="middle" class="card-title">MCP SERVERS</text>
  <text x="1030" y="670" text-anchor="middle" class="inner-sub">tools live from turn 2+</text>

  <!-- legend -->
  <path d="M60 752 L110 752" class="spine"/>
  <text x="122" y="758" class="legend-text">SERIAL ASSEMBLY</text>
  <path d="M340 752 L390 752" class="spine-async"/>
  <text x="402" y="758" class="legend-text">ASYNC / PARALLEL IO</text>
</svg>
