<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Auto-mode classifier: acceptEdits fast path and two-stage review">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 36px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #c9d5e3; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .card-sub { font-size: 17px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 17px; font-weight: 600; text-anchor: middle; }
    .footer { font-size: 17px; font-weight: 500; fill: #6e8296; text-anchor: middle; }
    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.12); stroke-width: 2; }
    .card-blue { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.45); stroke-width: 2; }
    .card-amber { fill: rgba(210,153,34,0.10); stroke: rgba(210,153,34,0.45); stroke-width: 2; }
    .card-green { fill: rgba(63,185,80,0.10); stroke: rgba(63,185,80,0.5); stroke-width: 2; }
    .card-purple { fill: rgba(168,85,247,0.08); stroke: rgba(168,85,247,0.45); stroke-width: 2; }
    .spine { fill: none; stroke: rgba(125,196,255,0.65); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="15" markerHeight="15" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.7)"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="15" markerHeight="15" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(63,185,80,0.8)"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="15" markerHeight="15" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(210,153,34,0.8)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="600" y="64" text-anchor="middle" class="title">Auto-Mode Classifier · Two Stages</text>
  <text x="600" y="102" text-anchor="middle" class="subtitle">stage 1 errs toward blocking — stage 2 re-reviews before interrupting the user</text>

  <!-- row 1: fast path -->
  <rect x="60" y="170" width="240" height="110" rx="14" class="card"/>
  <text x="180" y="212" class="card-title">TOOL USE</text>
  <text x="180" y="247" class="card-sub">auto mode decision point</text>

  <rect x="400" y="170" width="260" height="110" rx="14" class="card-blue"/>
  <rect x="475" y="158" width="110" height="28" rx="14" fill="rgba(63,185,80,0.15)" stroke="rgba(63,185,80,0.5)" stroke-width="1.5"/>
  <text x="530" y="178" class="arrow-text" fill="#3fb950">FAST PATH</text>
  <text x="530" y="208" class="card-title">ACCEPT EDITS?</text>
  <text x="530" y="240" class="card-sub">simulate acceptEdits first</text>
  <text x="530" y="266" class="card-sub">Agent / REPL never skip</text>

  <rect x="800" y="170" width="280" height="110" rx="14" class="card-green"/>
  <text x="940" y="212" class="card-title">ALLOW</text>
  <text x="940" y="247" class="card-sub">no dialog, no interruption</text>

  <!-- arrows: fast path (green = allow, thick) -->
  <path d="M300 225 L396 225" class="spine" marker-end="url(#arrow)"/>
  <text x="348" y="210" class="arrow-text" fill="#9fb1c8">auto</text>
  <path d="M660 225 L796 225" class="spine" style="stroke: rgba(63,185,80,0.85); stroke-width: 5" marker-end="url(#arrow-green)"/>
  <text x="728" y="208" class="arrow-text" fill="#3fb950">allow</text>

  <!-- row 2: two stages -->
  <rect x="60" y="390" width="240" height="120" rx="14" class="card-amber"/>
  <text x="180" y="432" class="card-title">STAGE 1 &#183; FAST</text>
  <text x="180" y="466" class="card-sub">max_tokens 64</text>
  <text x="180" y="494" class="card-sub">errs toward &#060;block&#062;</text>

  <rect x="400" y="390" width="260" height="120" rx="14" class="card-purple"/>
  <text x="530" y="432" class="card-title">STAGE 2 &#183; THINKING</text>
  <text x="530" y="466" class="card-sub">4096 tokens &#183; full review</text>
  <text x="530" y="494" class="card-sub">re-reviews every block</text>

  <rect x="800" y="390" width="280" height="120" rx="14" class="card"/>
  <text x="940" y="432" class="card-title" fill="#d29922">ASK THE USER</text>
  <text x="940" y="466" class="card-sub">dialog + risk explanation</text>
  <text x="940" y="494" class="card-sub">checkmark stays 1-3 s</text>

  <!-- arrows: two stages (amber = block path, thick) -->
  <path d="M180 280 L180 386" class="spine" marker-end="url(#arrow)"/>
  <text x="255" y="338" class="arrow-text" fill="#9fb1c8">still asks</text>
  <path d="M300 450 L396 450" class="spine" style="stroke: rgba(210,153,34,0.8); stroke-width: 5" marker-end="url(#arrow-amber)"/>
  <text x="348" y="432" class="arrow-text" fill="#d29922">block</text>
  <path d="M660 450 L796 450" class="spine" style="stroke: rgba(210,153,34,0.8); stroke-width: 5" marker-end="url(#arrow-amber)"/>
  <text x="728" y="432" class="arrow-text" fill="#d29922">still block</text>
  <path d="M300 410 L830 286" class="spine" style="stroke: rgba(63,185,80,0.7)" marker-end="url(#arrow-green)"/>
  <text x="565" y="336" class="arrow-text" fill="#3fb950">allow</text>
  <path d="M560 390 L1000 284" class="spine" style="stroke: rgba(63,185,80,0.55)" marker-end="url(#arrow-green)"/>
  <text x="782" y="322" class="arrow-text" fill="#3fb950">overturn</text>

  <text x="530" y="548" class="card-sub">stage 1 + stage 2 share one system prompt — stage 2 hits stage 1's cache prefix</text>

  <text x="600" y="600" class="footer">fail-closed: parse failure, timeout, or overflow blocks for safety</text>
</svg>
