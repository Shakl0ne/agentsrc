<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="OpenCode — A 100k-line Agent, Assembled as One Chain">
  <style>
    text { font-family: "Inter", "SF Pro Display", "Segoe UI", Arial, sans-serif; }
    .kicker  { font-size: 32px; font-weight: 700; fill: #f5d78e; letter-spacing: 6px; }
    .title   { font-size: 80px; font-weight: 900; fill: #ffffff; }
    .acc     { font-size: 78px; font-weight: 900; fill: #e6c15a; }
    .sub     { font-size: 40px; font-weight: 500; fill: #d8c9a3; }
    .step    { font-size: 34px; font-weight: 800; fill: #ffffff; }
    .stepsub { font-size: 26px; font-weight: 500; fill: #c9b98a; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0a08"/>
      <stop offset="0.5" stop-color="#16130d"/>
      <stop offset="1" stop-color="#0b0a08"/>
    </linearGradient>
    <radialGradient id="blu" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="rgba(230,193,90,0.12)"/>
      <stop offset="1" stop-color="rgba(230,193,90,0)"/>
    </radialGradient>
    <marker id="ha" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#e6c15a"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#blu)"/>

  <text x="800" y="180" text-anchor="middle" class="kicker">OPENCODE · OPEN SOURCE</text>
  <text x="800" y="330" text-anchor="middle" class="title">A 100K-line Agent,</text>
  <text x="800" y="430" text-anchor="middle" class="acc">Assembled as One Chain</text>

  <!-- CLI -->
  <rect x="90" y="600" width="250" height="120" rx="12" fill="#1c1810" stroke="#e6c15a" stroke-width="5"/>
  <text x="215" y="654" text-anchor="middle" class="step">CLI ENTRY</text>
  <text x="215" y="696" text-anchor="middle" class="stepsub">one entry</text>

  <!-- ENGINE -->
  <rect x="470" y="600" width="250" height="120" rx="12" fill="#1c1810" stroke="#e6c15a" stroke-width="5"/>
  <text x="595" y="654" text-anchor="middle" class="step">ENGINE</text>
  <text x="595" y="696" text-anchor="middle" class="stepsub">runtime</text>

  <!-- SESSION -->
  <rect x="850" y="600" width="250" height="120" rx="12" fill="#1c1810" stroke="#e6c15a" stroke-width="5"/>
  <text x="975" y="654" text-anchor="middle" class="step">SESSION</text>
  <text x="975" y="696" text-anchor="middle" class="stepsub">main loop</text>

  <!-- MODEL -->
  <rect x="1230" y="600" width="250" height="120" rx="12" fill="#1c1810" stroke="#e6c15a" stroke-width="5"/>
  <text x="1355" y="654" text-anchor="middle" class="step">MODEL</text>
  <text x="1355" y="696" text-anchor="middle" class="stepsub">layer</text>

  <!-- drawn arrows -->
  <line x1="342" y1="660" x2="464" y2="660" stroke="#e6c15a" stroke-width="3" marker-end="url(#ha)"/>
  <line x1="722" y1="660" x2="844" y2="660" stroke="#e6c15a" stroke-width="3" marker-end="url(#ha)"/>
  <line x1="1102" y1="660" x2="1224" y2="660" stroke="#e6c15a" stroke-width="3" marker-end="url(#ha)"/>
</svg>