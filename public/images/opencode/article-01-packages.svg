<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="OpenCode Three Engine Packages">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, "Segoe UI", Arial, sans-serif; }
    .title   { font-size: 64px; font-weight: 800; fill: #f2fbff; }
    .subtitle{ font-size: 40px; font-weight: 600; fill: #90e0ef; }
    .node    { font-size: 54px; font-weight: 800; fill: #ffffff; }
    .sub     { font-size: 36px; font-weight: 600; fill: #a8e6ff; }
    .detail  { font-size: 28px; font-weight: 500; fill: #6fd7ff; }
    .muted   { font-size: 30px; font-weight: 700; fill: #8ef7c9; }
    .tag     { font-size: 30px; font-weight: 700; fill: #ffe6a8; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d1f3c"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#123356" stroke-width="1"/>
    </pattern>
    <marker id="ah" markerWidth="20" markerHeight="14" refX="17" refY="7" orient="auto">
      <polygon points="0 0, 16 7, 0 14" fill="#22b8ff"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.5"/>

  <text x="800" y="92" text-anchor="middle" class="title">Three Engine Packages</text>
  <text x="800" y="150" text-anchor="middle" class="subtitle">Dependency hierarchy · responsibility split</text>

  <!-- opencode hub -->
  <rect x="420" y="210" width="760" height="230" rx="18" fill="#0f2340" stroke="#22b8ff" stroke-width="6"/>
  <text x="800" y="278" text-anchor="middle" class="node">packages/opencode</text>
  <text x="800" y="336" text-anchor="middle" class="sub">Runtime implementation · ~82K lines</text>
  <text x="800" y="388" text-anchor="middle" class="detail">runLoop · tools · agents · context · providers · session</text>

  <!-- core -->
  <rect x="160" y="540" width="600" height="210" rx="18" fill="#0f2340" stroke="#22f0a8" stroke-width="6"/>
  <text x="460" y="610" text-anchor="middle" class="node">packages/core</text>
  <text x="460" y="664" text-anchor="middle" class="sub">Base · Contracts · ~12K lines</text>
  <text x="460" y="712" text-anchor="middle" class="detail">Schema · Provider adapters · types</text>
  <text x="460" y="740" text-anchor="middle" class="muted">NO internal package deps</text>

  <!-- llm -->
  <rect x="900" y="540" width="380" height="300" rx="18" fill="#0f2340" stroke="#08ef0a" stroke-width="6"/>
  <text x="1090" y="610" text-anchor="middle" class="node">packages/llm</text>
  <text x="1090" y="664" text-anchor="middle" class="sub">Model Protocol · ~8.7K lines</text>
  <text x="1090" y="720" text-anchor="middle" class="detail">Protocol · Endpoint · Auth</text>
  <text x="1090" y="768" text-anchor="middle" class="tag">INDEPENDENT</text>

  <!-- dependency arrows -->
  <line x1="640" y1="410" x2="460" y2="540" stroke="#22b8ff" stroke-width="6" marker-end="url(#ah)"/>
  <text x="495" y="500" text-anchor="middle" class="muted">depends</text>
  <line x1="960" y1="410" x2="1090" y2="540" stroke="#22b8ff" stroke-width="6" marker-end="url(#ah)"/>
  <text x="1060" y="500" text-anchor="middle" class="muted">depends</text>

  <text x="800" y="870" text-anchor="middle" class="detail">opencode also depends on sdk · plugin · ui</text>
</svg>