<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Three Entry Boundaries">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 44px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 22px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 38px; font-weight: 700; fill: #f0f6fc; }
    .card-meta { font-size: 22px; font-weight: 500; fill: #d2dbe5; }
    .card { fill: rgba(255,255,255,0.07); stroke: rgba(255,255,255,0.17); stroke-width: 2; }
    .spine { fill: none; stroke: rgba(125,196,255,0.62); stroke-width: 3; stroke-linecap: round; }
    .spine-soft { fill: none; stroke: rgba(125,196,255,0.16); stroke-width: 14; stroke-linecap: round; }
    .dot { fill: rgba(125,196,255,0.90); }
    .bar-blue { fill: #58a6ff; }
    .bar-purple { fill: #bc8cff; }
    .bar-green { fill: #3fb950; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="48%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowBlue" cx="18%" cy="18%" r="34%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="82%" cy="34%" r="30%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="85%" r="34%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glowBlue)"/>
  <rect width="1600" height="900" fill="url(#glowPurple)"/>
  <rect width="1600" height="900" fill="url(#glowGreen)"/>

  <text x="800" y="68" text-anchor="middle" class="title">Three Entry Boundaries</text>
  <text x="800" y="104" text-anchor="middle" class="subtitle">input, concurrency, orchestration</text>

  <path d="M800 160 L800 260" class="spine-soft"/><path d="M800 160 L800 260" class="spine"/>
  <path d="M800 420 L800 520" class="spine-soft"/><path d="M800 420 L800 520" class="spine"/>
  <path d="M800 680 L800 780" class="spine-soft"/><path d="M800 680 L800 780" class="spine"/>
  <circle cx="800" cy="260" r="6" class="dot"/>
  <circle cx="800" cy="520" r="6" class="dot"/>
  <circle cx="800" cy="780" r="6" class="dot"/>

  <g>
    <rect x="380" y="155" width="840" height="130" rx="28" class="card"/>
    <rect x="396" y="171" width="16" height="52" rx="8" class="bar-blue"/>
    <text x="480" y="218" class="card-title">prompt()</text>
    <text x="480" y="252" class="card-meta">persist user message before any reply</text>
  </g>

  <g>
    <rect x="420" y="415" width="760" height="130" rx="28" class="card"/>
    <rect x="436" y="431" width="16" height="52" rx="8" class="bar-purple"/>
    <text x="520" y="478" class="card-title">loop()</text>
    <text x="520" y="512" class="card-meta">one runner per session, no parallel chains</text>
  </g>

  <g>
    <rect x="380" y="675" width="840" height="130" rx="28" class="card"/>
    <rect x="396" y="691" width="16" height="52" rx="8" class="bar-green"/>
    <text x="480" y="738" class="card-title">runLoop()</text>
    <text x="480" y="772" class="card-meta">llm, tools, compaction, subtasks → one loop</text>
  </g>
</svg>
