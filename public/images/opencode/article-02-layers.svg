<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Three Entry Boundaries">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 40px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #b7c3d2; }
    .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2.2px; fill: #9fb1c8; }
    .card-title { font-size: 30px; font-weight: 700; fill: #f0f6fc; }
    .card-meta { font-size: 18px; font-weight: 500; fill: #d2dbe5; }
    .tag { font-size: 17px; font-weight: 700; letter-spacing: 1.4px; fill: #f0f6fc; }
    .tag-note { font-size: 16px; font-weight: 500; fill: #d2dbe5; }
    .card { fill: rgba(255,255,255,0.07); stroke: rgba(255,255,255,0.17); stroke-width: 2; }
    .tag-card { fill: rgba(255,255,255,0.06); stroke: rgba(125,196,255,0.22); stroke-width: 1.6; }
    .card-line { stroke: rgba(255,255,255,0.24); stroke-width: 1.2; }
    .guide { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 1; }
    .spine { fill: none; stroke: rgba(125,196,255,0.62); stroke-width: 3; stroke-linecap: round; }
    .spine-soft { fill: none; stroke: rgba(125,196,255,0.16); stroke-width: 11; stroke-linecap: round; }
    .attach { fill: none; stroke: rgba(125,196,255,0.56); stroke-width: 2.4; stroke-linecap: round; }
    .dot { fill: rgba(125,196,255,0.90); }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="48%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowBlue" cx="18%" cy="18%" r="34%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="82%" cy="34%" r="30%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="85%" r="34%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fieldBlue" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fieldPurple" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fieldGreen" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glowBlue)"/>
  <rect width="1600" height="900" fill="url(#glowPurple)"/>
  <rect width="1600" height="900" fill="url(#glowGreen)"/>

  <text x="800" y="72" text-anchor="middle" class="title">Three Entry Boundaries</text>
  <text x="800" y="106" text-anchor="middle" class="subtitle">input, concurrency, orchestration</text>

  <path d="M420 180 H1180" class="guide"/>
  <path d="M420 738 H1180" class="guide"/>

  <path d="M800 286 L800 338" class="spine-soft"/>
  <path d="M800 498 L800 550" class="spine-soft"/>
  <path d="M800 286 L800 338" class="spine"/>
  <path d="M800 498 L800 550" class="spine"/>
  <circle cx="800" cy="338" r="6" class="dot"/>
  <circle cx="800" cy="550" r="6" class="dot"/>

  <g>
    <rect x="260" y="170" width="900" height="132" rx="28" fill="url(#fieldBlue)"/>
    <rect x="272" y="178" width="876" height="132" rx="28" class="card"/>
    <line x1="312" y1="208" x2="1108" y2="208" class="card-line"/>
    <rect x="322" y="228" width="14" height="50" rx="7" fill="#58a6ff"/>
    <text x="400" y="238" class="eyebrow">ENTRY</text>
    <text x="400" y="272" class="card-title">prompt()</text>
    <text x="400" y="300" class="card-meta">persist user message before any reply</text>
    <path d="M1148 244 C1208 244 1228 244 1260 244" class="attach"/>
    <rect x="1268" y="206" width="220" height="72" rx="22" class="tag-card"/>
    <text x="1378" y="236" text-anchor="middle" class="tag">MESSAGE FIRST</text>
    <text x="1378" y="262" text-anchor="middle" class="tag-note">history can exist without reply</text>
  </g>

  <g>
    <rect x="360" y="380" width="800" height="132" rx="28" fill="url(#fieldPurple)"/>
    <rect x="372" y="388" width="776" height="132" rx="28" class="card"/>
    <line x1="412" y1="418" x2="1108" y2="418" class="card-line"/>
    <rect x="422" y="438" width="14" height="50" rx="7" fill="#bc8cff"/>
    <text x="500" y="448" class="eyebrow">GUARD</text>
    <text x="500" y="482" class="card-title">loop()</text>
    <text x="500" y="510" class="card-meta">one runner per session, no parallel execution chains</text>
    <path d="M1148 454 C1204 454 1220 454 1252 454" class="attach"/>
    <rect x="1260" y="416" width="228" height="72" rx="22" class="tag-card"/>
    <text x="1374" y="446" text-anchor="middle" class="tag">SINGLE RUNNER</text>
    <text x="1374" y="472" text-anchor="middle" class="tag-note">session state stays consistent</text>
  </g>

  <g>
    <rect x="260" y="592" width="900" height="132" rx="28" fill="url(#fieldGreen)"/>
    <rect x="272" y="600" width="876" height="132" rx="28" class="card"/>
    <line x1="312" y1="630" x2="1108" y2="630" class="card-line"/>
    <rect x="322" y="650" width="14" height="50" rx="7" fill="#3fb950"/>
    <text x="400" y="660" class="eyebrow">ORCHESTRATION</text>
    <text x="400" y="694" class="card-title">runLoop()</text>
    <text x="400" y="722" class="card-meta">llm, tools, compaction, subtasks return to one decision loop</text>
    <path d="M1148 666 C1208 666 1226 666 1258 666" class="attach"/>
    <rect x="1266" y="628" width="222" height="72" rx="22" class="tag-card"/>
    <text x="1377" y="658" text-anchor="middle" class="tag">ONE DECISION LOOP</text>
    <text x="1377" y="684" text-anchor="middle" class="tag-note">continue, compact, or stop</text>
  </g>
</svg>
