<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Three Entry Boundaries">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 40px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 36px; font-weight: 700; fill: #f0f6fc; }
    .card-meta { font-size: 22px; font-weight: 500; fill: #d2dbe5; }
    .card { fill: rgba(255,255,255,0.07); stroke: rgba(255,255,255,0.17); stroke-width: 2; }
    .spine { fill: none; stroke: rgba(125,196,255,0.52); stroke-width: 4; stroke-linecap: round; }
    .spine-soft { fill: none; stroke: rgba(125,196,255,0.14); stroke-width: 14; stroke-linecap: round; }
    .link { fill: none; stroke: rgba(125,196,255,0.52); stroke-width: 3; stroke-linecap: round; }
    .dot { fill: rgba(125,196,255,0.92); }
    .bar-blue { fill: #58a6ff; }
    .bar-purple { fill: #bc8cff; }
    .bar-green { fill: #3fb950; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="48%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowBlue" cx="18%" cy="18%" r="34%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="82%" cy="34%" r="30%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="85%" r="34%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glowBlue)"/>
  <rect width="1600" height="900" fill="url(#glowPurple)"/>
  <rect width="1600" height="900" fill="url(#glowGreen)"/>

  <text x="800" y="68" text-anchor="middle" class="title">Three Entry Boundaries</text>
  <text x="800" y="100" text-anchor="middle" class="subtitle">input, concurrency, orchestration</text>

  <path d="M360 220 V640" class="spine-soft"/>
  <path d="M360 220 V640" class="spine"/>
  <circle cx="360" cy="240" r="6" class="dot"/>
  <circle cx="360" cy="450" r="6" class="dot"/>
  <circle cx="360" cy="660" r="6" class="dot"/>

  <path d="M360 240 H460" class="link"/>
  <path d="M360 450 H460" class="link"/>
  <path d="M360 660 H460" class="link"/>

  <g>
    <rect x="460" y="180" width="700" height="120" rx="28" class="card"/>
    <rect x="500" y="214" width="16" height="52" rx="8" class="bar-blue"/>
    <text x="588" y="238" class="card-title">prompt()</text>
    <text x="588" y="270" class="card-meta">persist user message before reply</text>
  </g>

  <g>
    <rect x="460" y="390" width="700" height="120" rx="28" class="card"/>
    <rect x="500" y="424" width="16" height="52" rx="8" class="bar-purple"/>
    <text x="588" y="448" class="card-title">loop()</text>
    <text x="588" y="480" class="card-meta">keep one runner per session</text>
  </g>

  <g>
    <rect x="460" y="600" width="700" height="120" rx="28" class="card"/>
    <rect x="500" y="634" width="16" height="52" rx="8" class="bar-green"/>
    <text x="588" y="658" class="card-title">runLoop()</text>
    <text x="588" y="690" class="card-meta">route work through one loop</text>
  </g>
</svg>
