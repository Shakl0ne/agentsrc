<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Three Core Layers">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 38px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #b7c3d2; }
    .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2.4px; fill: #9fb1c8; }
    .card-title { font-size: 30px; font-weight: 700; fill: #f0f6fc; }
    .card-meta { font-size: 18px; font-weight: 500; fill: #d2dbe5; }
    .card { fill: rgba(255,255,255,0.07); stroke: rgba(255,255,255,0.17); stroke-width: 2; }
    .card-line { stroke: rgba(255,255,255,0.24); stroke-width: 1.2; }
    .spine { fill: none; stroke: rgba(125,196,255,0.62); stroke-width: 3; stroke-linecap: round; }
    .spine-soft { fill: none; stroke: rgba(125,196,255,0.18); stroke-width: 10; stroke-linecap: round; }
    .guide { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 1; }
    .spine-node { fill: rgba(125,196,255,0.90); }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="22%" cy="22%" r="36%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="74%" cy="40%" r="32%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="48%" cy="88%" r="34%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="fieldBlue" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fieldPurple" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fieldGreen" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="820" fill="url(#bg)"/>
  <rect width="1200" height="820" fill="url(#grid)"/>
  <rect width="1200" height="820" fill="url(#glowBlue)"/>
  <rect width="1200" height="820" fill="url(#glowPurple)"/>
  <rect width="1200" height="820" fill="url(#glowGreen)"/>

  <text x="600" y="70" text-anchor="middle" class="title">Three Core Layers</text>
  <text x="600" y="104" text-anchor="middle" class="subtitle">separation before execution</text>

  <path d="M330 176 H870" class="guide"/>
  <path d="M330 638 H870" class="guide"/>

  <path d="M600 316 L600 352" class="spine-soft"/>
  <path d="M600 506 L600 542" class="spine-soft"/>
  <path d="M600 316 L600 352" class="spine"/>
  <path d="M600 506 L600 542" class="spine"/>
  <circle cx="600" cy="352" r="6" class="spine-node"/>
  <circle cx="600" cy="542" r="6" class="spine-node"/>

  <g>
    <rect x="210" y="156" width="780" height="138" rx="28" fill="url(#fieldBlue)"/>
    <rect x="220" y="164" width="760" height="138" rx="28" class="card"/>
    <line x1="258" y1="194" x2="942" y2="194" class="card-line"/>
    <rect x="268" y="214" width="14" height="52" rx="7" fill="#58a6ff"/>
    <text x="350" y="226" class="eyebrow">APP</text>
    <text x="350" y="259" class="card-title">opencode</text>
    <text x="350" y="293" class="card-meta">runtime · session · tools</text>
  </g>

  <g>
    <rect x="330" y="362" width="540" height="126" rx="26" fill="url(#fieldPurple)"/>
    <rect x="340" y="370" width="520" height="126" rx="26" class="card"/>
    <line x1="376" y1="400" x2="824" y2="400" class="card-line"/>
    <rect x="386" y="424" width="14" height="50" rx="7" fill="#bc8cff"/>
    <text x="470" y="432" class="eyebrow">MODEL</text>
    <text x="470" y="465" class="card-title">llm</text>
    <text x="470" y="489" class="card-meta">protocol · endpoint · auth</text>
  </g>

  <g>
    <rect x="210" y="562" width="780" height="138" rx="28" fill="url(#fieldGreen)"/>
    <rect x="220" y="570" width="760" height="138" rx="28" class="card"/>
    <line x1="258" y1="600" x2="942" y2="600" class="card-line"/>
    <rect x="268" y="620" width="14" height="52" rx="7" fill="#3fb950"/>
    <text x="350" y="632" class="eyebrow">CORE</text>
    <text x="350" y="665" class="card-title">core</text>
    <text x="350" y="699" class="card-meta">contracts · types · provider base</text>
  </g>
</svg>
