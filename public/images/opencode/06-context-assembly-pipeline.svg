<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Context Assembly Pipeline">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 13px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }

    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .card-async { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .card-warn { fill: rgba(239,68,68,0.08); stroke: rgba(239,68,68,0.3); stroke-width: 1.5; }
    .card-core { fill: rgba(168,85,247,0.08); stroke: rgba(168,85,247,0.4); stroke-width: 2; }

    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-warn { fill: none; stroke: rgba(239,68,68,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(63,185,80,0.8)"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(239,68,68,0.8)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">CONTEXT ASSEMBLY PIPELINE</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">Categorization and injection timing of different knowledge sources</text>

  <!-- Left: System Prompt -->
  <rect x="100" y="280" width="220" height="100" rx="12" class="card-highlight"/>
  <text x="210" y="325" class="card-title">SYSTEM PROMPT</text>
  <text x="210" y="355" class="inner-text">Every Request (Full)</text>

  <!-- Right: SQLite Messages -->
  <rect x="680" y="280" width="220" height="100" rx="12" class="card-async"/>
  <text x="790" y="325" class="card-title">SQLITE MESSAGES</text>
  <text x="790" y="355" class="inner-text">Runtime History</text>

  <!-- Bottom: Disk Knowledge -->
  <rect x="370" y="460" width="260" height="100" rx="12" class="card"/>
  <text x="500" y="505" class="card-title">DISK KNOWLEDGE</text>
  <text x="500" y="535" class="inner-text">On-Demand (Skills/Refs)</text>

  <!-- Top: Budget Gate -->
  <rect x="370" y="130" width="260" height="90" rx="12" class="card-warn"/>
  <text x="500" y="170" class="card-title">BUDGET GATE</text>
  <text x="500" y="200" class="inner-text">Overflow &amp; Compaction</text>

  <!-- Center: Context Window -->
  <rect x="370" y="270" width="260" height="120" rx="16" class="card-core"/>
  <text x="500" y="325" class="card-title">LLM CONTEXT WINDOW</text>
  <text x="500" y="355" class="inner-text">Assembled per request</text>

  <!-- Arrows -->
  <!-- Left to Center -->
  <path d="M 320 330 L 370 330" class="spine" marker-end="url(#arrow)"/>
  <text x="340" y="320" class="arrow-text">Injects</text>

  <!-- Right to Center -->
  <path d="M 680 330 L 630 330" class="spine-async" marker-end="url(#arrow-async)"/>
  <text x="660" y="320" class="arrow-text">Appends</text>

  <!-- Bottom to Center -->
  <path d="M 500 460 L 500 390" class="spine" marker-end="url(#arrow)"/>
  <text x="510" y="435" class="arrow-text" text-anchor="start">Tool Calls</text>

  <!-- Top to Center -->
  <path d="M 500 220 L 500 270" class="spine-warn" marker-end="url(#arrow-warn)"/>
  <text x="510" y="245" class="arrow-text" text-anchor="start">Truncates</text>

</svg>