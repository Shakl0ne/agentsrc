<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="OpenCode Single Entry Point">
  <style>
    text { font-family: 'Courier New', 'Lucida Console', monospace; }
    .title { font-size: 24px; font-weight: 700; fill: #caf0f8; }
    .subtitle { font-size: 13px; fill: #90e0ef; }
    .node-name { font-size: 16px; font-weight: 700; fill: #caf0f8; }
    .node-sub { font-size: 11px; fill: #90e0ef; }
    .node-detail { font-size: 10px; fill: #48cae4; opacity: 0.7; }
    .arrow-label { font-size: 10px; fill: #48cae4; }
    .muted { font-size: 10px; fill: #48cae4; opacity: 0.5; }
  </style>

  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#112240" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00b4d8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="500" fill="#0a1628"/>
  <rect width="960" height="500" fill="url(#grid)" opacity="0.6"/>

  <!-- Title -->
  <text x="480" y="42" text-anchor="middle" class="title">Single Entry Point</text>
  <text x="480" y="64" text-anchor="middle" class="subtitle">One CLI entry → one long-running chain</text>

  <!-- ==================== LEFT: CLI Entry ==================== -->
  <rect x="60" y="140" width="240" height="140" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1.5"/>
  <text x="180" y="175" text-anchor="middle" class="node-name">CLI Entry</text>
  <text x="180" y="200" text-anchor="middle" class="node-sub">index.ts · yargs</text>
  <text x="180" y="220" text-anchor="middle" class="node-detail">20+ subcommands</text>
  <text x="180" y="240" text-anchor="middle" class="node-detail">serve · init · config</text>
  <text x="180" y="260" text-anchor="middle" class="node-detail">session · list · ...</text>

  <!-- Arrow: CLI → Engine -->
  <polyline points="300,210 380,210" stroke="#00b4d8" stroke-width="2" fill="none" marker-end="url(#arrow-cyan)"/>
  <text x="340" y="198" text-anchor="middle" class="arrow-label">serve</text>

  <!-- ==================== MIDDLE: Engine Runtime ==================== -->
  <rect x="380" y="100" width="280" height="220" rx="4" fill="none" stroke="#00b4d8" stroke-width="0.8" stroke-dasharray="6,4"/>
  <text x="395" y="118" class="muted">EFFECT RUNTIME (same process)</text>

  <rect x="400" y="130" width="240" height="110" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="520" y="162" text-anchor="middle" class="node-name">Engine Runtime</text>
  <text x="520" y="184" text-anchor="middle" class="node-sub">Effect-TS · ~40 Services</text>
  <text x="520" y="204" text-anchor="middle" class="node-detail">session / processor / runLoop</text>
  <text x="520" y="224" text-anchor="middle" class="node-detail">long-running process</text>

  <!-- Two faces: HTTP + WS -->
  <rect x="400" y="255" width="115" height="50" rx="2" fill="#0d1f3c" stroke="#06d6a0" stroke-width="1"/>
  <text x="457" y="278" text-anchor="middle" class="node-name" font-size="13">HTTP API</text>
  <text x="457" y="296" text-anchor="middle" class="node-detail">REST endpoints</text>

  <rect x="525" y="255" width="115" height="50" rx="2" fill="#0d1f3c" stroke="#06d6a0" stroke-width="1"/>
  <text x="582" y="278" text-anchor="middle" class="node-name" font-size="13">WebSocket</text>
  <text x="582" y="296" text-anchor="middle" class="node-detail">real-time stream</text>

  <!-- ==================== RIGHT: Output / Meaning ==================== -->
  <rect x="720" y="140" width="200" height="140" rx="2" fill="#0d1f3c" stroke="#f77f00" stroke-width="1"/>
  <text x="820" y="175" text-anchor="middle" class="node-name">Long Chain</text>
  <text x="820" y="200" text-anchor="middle" class="node-sub">user → message → tool</text>
  <text x="820" y="220" text-anchor="middle" class="node-detail">LLM → response</text>
  <text x="820" y="240" text-anchor="middle" class="node-detail">background tasks</text>
  <text x="820" y="260" text-anchor="middle" class="node-detail">persistence</text>

  <!-- Arrow: Runtime → Right -->
  <polyline points="660,210 720,210" stroke="#00b4d8" stroke-width="2" fill="none" marker-end="url(#arrow-cyan)"/>
  <text x="690" y="198" text-anchor="middle" class="arrow-label">exposes</text>

  <!-- ==================== Bottom: Key Insight ==================== -->
  <rect x="200" y="390" width="560" height="50" rx="4" fill="none" stroke="#00b4d8" stroke-width="0.6" stroke-dasharray="4,3"/>
  <text x="480" y="420" text-anchor="middle" font-size="13" fill="#caf0f8" font-weight="600">One entry · One process · HTTP + WebSocket coexist</text>

  <!-- Title block -->
  <rect x="660" y="430" width="260" height="50" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <line x1="660" y1="448" x2="920" y2="448" stroke="#00b4d8" stroke-width="0.5"/>
  <text x="790" y="444" text-anchor="middle" fill="#caf0f8" font-size="9">ENTRY DESIGN</text>
  <text x="790" y="470" text-anchor="middle" fill="#00b4d8" font-size="13" font-weight="700">SINGLE ENTRY POINT</text>
</svg>
