<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="OpenCode Single Entry Point">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, "Segoe UI", Arial, sans-serif; }
    .title   { font-size: 66px; font-weight: 800; fill: #f2fbff; }
    .subtitle{ font-size: 40px; font-weight: 600; fill: #90e0ef; }
    .node    { font-size: 54px; font-weight: 800; fill: #ffffff; }
    .sub     { font-size: 34px; font-weight: 600; fill: #a8e6ff; }
    .detail  { font-size: 28px; font-weight: 500; fill: #6fd7ff; }
    .label   { font-size: 32px; font-weight: 700; fill: #8ef7c9; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d1f3c"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#123356" stroke-width="1"/>
    </pattern>
    <marker id="ah" markerWidth="20" markerHeight="14" refX="17" refY="7" orient="auto">
      <polygon points="0 0, 16 7, 0 14" fill="#22b8ff"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.5"/>

  <text x="800" y="96" text-anchor="middle" class="title">One Entry · One Long-Running Chain</text>
  <text x="800" y="152" text-anchor="middle" class="subtitle">CLI and Web share the same engine</text>

  <!-- CLI ENTRY (left) -->
  <rect x="120" y="300" width="460" height="300" rx="18" fill="#0f2340" stroke="#22b8ff" stroke-width="6"/>
  <text x="350" y="400" text-anchor="middle" class="node">CLI ENTRY</text>
  <text x="350" y="468" text-anchor="middle" class="sub">index.ts · yargs</text>
  <text x="350" y="522" text-anchor="middle" class="detail">20+ subcommands</text>
  <text x="350" y="568" text-anchor="middle" class="detail">serve · run · tui · acp · mcp</text>

  <!-- arrows CLI -> engine -->
  <line x1="580" y1="450" x2="760" y2="450" stroke="#22b8ff" stroke-width="7" marker-end="url(#ah)"/>
  <text x="672" y="434" text-anchor="middle" class="label">launches</text>

  <!-- Engine Runtime (center) -->
  <rect x="800" y="300" width="520" height="300" rx="18" fill="#0f2340" stroke="#22f0a8" stroke-width="7"/>
  <text x="1060" y="380" text-anchor="middle" class="node">serve</text>
  <text x="1060" y="448" text-anchor="middle" class="sub">Engine runtime</text>
  <text x="1060" y="506" text-anchor="middle" class="detail">Effect runtime · ~40 services</text>
  <text x="1060" y="556" text-anchor="middle" class="detail">InstanceState singleton</text>

  <!-- HTTP (top right) + WS (bottom right) -->
  <rect x="1400" y="316" width="180" height="130" rx="12" fill="#0f2340" stroke="#22f0a8" stroke-width="6"/>
  <text x="1490" y="378" text-anchor="middle" class="node">HTTP</text>
  <text x="1490" y="420" text-anchor="middle" class="sub">REST</text>
  <line x1="1400" y1="380" x2="1325" y2="455" stroke="#22f0a8" stroke-width="6" marker-end="url(#ah)"/>

  <rect x="1400" y="460" width="180" height="130" rx="12" fill="#0f2340" stroke="#22f0a8" stroke-width="6"/>
  <text x="1490" y="520" text-anchor="middle" class="node">WS</text>
  <text x="1490" y="562" text-anchor="middle" class="sub">stream</text>
  <line x1="1400" y1="525" x2="1320" y2="470" stroke="#22f0a8" stroke-width="6" marker-end="url(#ah)"/>

  <text x="1060" y="690" text-anchor="middle" class="subtitle">One process opens HTTP API + WebSocket simultaneously</text>
</svg>