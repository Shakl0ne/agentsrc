<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-label="OpenCode Monorepo Package Topology">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, "Segoe UI", Arial, sans-serif; }
    .title { fill: url(#titleGrad); }
    .text-1 { fill: #f3f7fc; }
    .text-2 { fill: #d5dde8; }
    .text-3 { fill: #c0cbda; }
    .card { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.18); stroke-width: 1.9; }
    .hub { fill: rgba(88,166,255,0.09); stroke: rgba(88,166,255,0.42); stroke-width: 2.2; }
    .core { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.40); stroke-width: 2.1; }
    .capsule { fill: rgba(63,185,80,0.14); stroke: rgba(63,185,80,0.34); stroke-width: 1.6; }
    .arrow { fill: none; stroke: #66b3ff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18"/>
      <stop offset="52%" stop-color="#101828"/>
      <stop offset="100%" stop-color="#0a0f18"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#69b8ff"/>
      <stop offset="100%" stop-color="#c294ff"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="22%" cy="24%" r="42%">
      <stop offset="0%" stop-color="rgba(88,166,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(88,166,255,0)"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="32%" r="38%">
      <stop offset="0%" stop-color="rgba(188,140,255,0.11)"/>
      <stop offset="100%" stop-color="rgba(188,140,255,0)"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="95%" r="42%">
      <stop offset="0%" stop-color="rgba(63,185,80,0.10)"/>
      <stop offset="100%" stop-color="rgba(63,185,80,0)"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0 L0 0 0 36" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.7"/>
    </pattern>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#66b3ff"/>
    </marker>
  </defs>

  <rect width="960" height="960" fill="url(#bg)"/>
  <rect width="960" height="960" fill="url(#grid)"/>
  <rect width="960" height="960" fill="url(#glowBlue)"/>
  <rect width="960" height="960" fill="url(#glowPurple)"/>
  <rect width="960" height="960" fill="url(#glowGreen)"/>

  <text x="480" y="48" text-anchor="middle" font-size="34" font-weight="700" class="title">OpenCode Monorepo · Package Topology</text>
  <text x="480" y="80" text-anchor="middle" font-size="15" class="text-2">CLI entry on top, opencode as the hub, core as the contract foundation</text>

  <rect x="360" y="102" width="240" height="58" rx="16" class="card"/>
  <text x="480" y="131" text-anchor="middle" font-size="22" font-weight="700" class="text-1">CLI ENTRY</text>
  <text x="480" y="150" text-anchor="middle" font-size="13" class="text-3">terminal interface</text>

  <line x1="480" y1="160" x2="480" y2="214" class="arrow" marker-end="url(#arrowHead)"/>

  <rect x="255" y="214" width="450" height="172" rx="22" class="hub"/>
  <text x="480" y="258" text-anchor="middle" font-size="27" font-weight="700" class="text-1">packages/opencode</text>
  <text x="480" y="290" text-anchor="middle" font-size="15" class="text-2">main implementation package</text>
  <text x="480" y="322" text-anchor="middle" font-size="14" class="text-3">runLoop · tools · agents · context · providers</text>

  <rect x="70" y="410" width="220" height="98" rx="16" class="card"/>
  <text x="180" y="448" text-anchor="middle" font-size="20" font-weight="700" class="text-1">packages/plugin</text>
  <text x="180" y="478" text-anchor="middle" font-size="14" class="text-2">hook surface</text>

  <rect x="670" y="410" width="220" height="98" rx="16" class="card"/>
  <text x="780" y="448" text-anchor="middle" font-size="20" font-weight="700" class="text-1">packages/sdk</text>
  <text x="780" y="478" text-anchor="middle" font-size="14" class="text-2">client sdk</text>

  <rect x="70" y="575" width="220" height="98" rx="16" class="card"/>
  <text x="180" y="613" text-anchor="middle" font-size="20" font-weight="700" class="text-1">packages/ui</text>
  <text x="180" y="643" text-anchor="middle" font-size="14" class="text-2">shared ui</text>

  <rect x="670" y="575" width="220" height="98" rx="16" class="card"/>
  <text x="780" y="613" text-anchor="middle" font-size="20" font-weight="700" class="text-1">web / console</text>
  <text x="780" y="643" text-anchor="middle" font-size="14" class="text-2">frontend surfaces</text>

  <rect x="50" y="720" width="860" height="110" rx="22" class="core"/>
  <text x="480" y="768" text-anchor="middle" font-size="24" font-weight="700" class="text-1">packages/core</text>
  <text x="480" y="798" text-anchor="middle" font-size="15" class="text-2">contracts · types · interfaces</text>

  <text x="480" y="854" text-anchor="middle" font-size="13" class="text-3">supporting implementation deps</text>
  <rect x="310" y="870" width="96" height="40" rx="20" class="capsule"/>
  <text x="358" y="895" text-anchor="middle" font-size="14" font-weight="700" class="text-1">llm</text>

  <rect x="430" y="870" width="142" height="40" rx="20" class="capsule"/>
  <text x="501" y="895" text-anchor="middle" font-size="13" font-weight="700" class="text-1">http-recorder</text>

  <rect x="596" y="870" width="96" height="40" rx="20" class="capsule"/>
  <text x="644" y="895" text-anchor="middle" font-size="14" font-weight="700" class="text-1">script</text>

  <path d="M255 260 H28 V459 H70" class="arrow" marker-end="url(#arrowHead)"/>
  <path d="M318 386 H28 V624 H70" class="arrow" marker-end="url(#arrowHead)"/>
  <path d="M705 260 H932 V459 H890" class="arrow" marker-end="url(#arrowHead)"/>
  <path d="M642 386 H932 V775 H910" class="arrow" marker-end="url(#arrowHead)"/>

  <line x1="290" y1="459" x2="670" y2="459" class="arrow" marker-end="url(#arrowHead)"/>
  <line x1="290" y1="624" x2="670" y2="624" class="arrow" marker-end="url(#arrowHead)"/>
  <line x1="670" y1="594" x2="290" y2="594" class="arrow" marker-end="url(#arrowHead)"/>
  <line x1="780" y1="575" x2="780" y2="508" class="arrow" marker-end="url(#arrowHead)"/>
  <line x1="180" y1="673" x2="180" y2="720" class="arrow" marker-end="url(#arrowHead)"/>
</svg>
