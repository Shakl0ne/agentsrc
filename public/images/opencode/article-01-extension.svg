<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="OpenCode Persistence and Extension">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, "Segoe UI", Arial, sans-serif; }
    .title   { font-size: 64px; font-weight: 800; fill: #f2fbff; }
    .subtitle{ font-size: 38px; font-weight: 600; fill: #90e0ef; }
    .node    { font-size: 50px; font-weight: 800; fill: #ffffff; }
    .sub     { font-size: 32px; font-weight: 600; fill: #a8e6ff; }
    .detail  { font-size: 27px; font-weight: 500; fill: #6fd7ff; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d1f3c"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#123356" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.5"/>

  <text x="800" y="96" text-anchor="middle" class="title">State You Can Audit · Capabilities That Grow</text>
  <text x="800" y="150" text-anchor="middle" class="subtitle">Persistence (bottom) + extension surfaces (around), permission-gated</text>

  <!-- SQLite base -->
  <rect x="420" y="700" width="760" height="150" rx="16" fill="#0f2340" stroke="#22f0a8" stroke-width="7"/>
  <text x="800" y="770" text-anchor="middle" class="node">SQLite · Drizzle ORM</text>
  <text x="800" y="806" text-anchor="middle" class="sub">session · message · tool</text>
  <text x="800" y="836" text-anchor="middle" class="sub">structured persistence</text>

  <!-- Extension modules around -->
  <rect x="100" y="220" width="420" height="132" rx="12" fill="#0f2340" stroke="#22b8ff" stroke-width="6"/>
  <text x="310" y="286" text-anchor="middle" class="node">Plugin</text>
  <text x="310" y="334" text-anchor="middle" class="sub">public hook surface</text>

  <rect x="545" y="220" width="470" height="140" rx="12" fill="#0f2340" stroke="#22b8ff" stroke-width="6"/>
  <text x="780" y="286" text-anchor="middle" class="node">MCP</text>
  <text x="780" y="318" text-anchor="middle" class="sub" style="font-size:28px">stdio · SSE</text>
  <text x="780" y="342" text-anchor="middle" class="sub" style="font-size:28px">StreamableHTTP</text>

  <rect x="1040" y="220" width="460" height="132" rx="12" fill="#0f2340" stroke="#22b8ff" stroke-width="6"/>
  <text x="1270" y="286" text-anchor="middle" class="node">Skill</text>
  <text x="1270" y="334" text-anchor="middle" class="sub">discover · inject</text>

  <rect x="200" y="400" width="560" height="132" rx="12" fill="#0f2340" stroke="#ff9f43" stroke-width="6"/>
  <text x="480" y="466" text-anchor="middle" class="node">Snapshot</text>
  <text x="480" y="514" text-anchor="middle" class="sub">state save · restore · replay</text>

  <rect x="840" y="400" width="560" height="132" rx="12" fill="#0f2340" stroke="#ff9f43" stroke-width="6"/>
  <text x="1120" y="466" text-anchor="middle" class="node">Background Jobs</text>
  <text x="1120" y="514" text-anchor="middle" class="sub">async tasks · job scheduler</text>

  <!-- Permission gate banner -->
  <rect x="360" y="600" width="880" height="70" rx="10" fill="#3b1020" stroke="#ff5c7a" stroke-width="5"/>
  <text x="800" y="648" text-anchor="middle" class="node" font-size="38">All gated by Permission (ask / allow / deny)</text>
</svg>
