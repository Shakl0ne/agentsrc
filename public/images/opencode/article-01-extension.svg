<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="OpenCode core and extension surface overview">
  <style>
    text { font-family: 'Courier New', 'Lucida Console', 'Microsoft YaHei', 'SimHei', monospace; fill: #caf0f8; }
    .title { font-size: 30px; font-weight: 700; letter-spacing: 0.04em; }
    .subtitle { font-size: 15px; fill: #90e0ef; }
    .core-title { font-size: 26px; font-weight: 700; }
    .core-sub { font-size: 15px; fill: #90e0ef; }
    .node-title { font-size: 16px; font-weight: 700; }
    .node-sub { font-size: 12px; fill: #90e0ef; }
    .core { fill: #0d1f3c; stroke: #00b4d8; stroke-width: 2.8; rx: 2; ry: 2; }
    .node { fill: #10294c; stroke: #48cae4; stroke-width: 2.2; rx: 2; ry: 2; }
    .arrow { fill: none; stroke: #00b4d8; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
    .foot-label { font-size: 11px; fill: #48cae4; }
  </style>

  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#112240" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#00b4d8"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#0a1628"/>
  <rect width="960" height="600" fill="url(#grid)" opacity="0.6"/>

  <text x="480" y="46" text-anchor="middle" class="title">OPENCODE · CORE AND EXTENSIONS</text>
  <text x="480" y="74" text-anchor="middle" class="subtitle">NEW CAPABILITIES STAY OUTSIDE THE CORE ENGINE</text>

  <rect x="185" y="110" width="170" height="74" class="node"/>
  <text x="270" y="141" text-anchor="middle" class="node-title">PLUGIN</text>
  <text x="270" y="162" text-anchor="middle" class="node-sub">hook surface</text>

  <rect x="395" y="110" width="170" height="74" class="node"/>
  <text x="480" y="141" text-anchor="middle" class="node-title">MCP</text>
  <text x="480" y="162" text-anchor="middle" class="node-sub">external tools</text>

  <rect x="605" y="110" width="170" height="74" class="node"/>
  <text x="690" y="141" text-anchor="middle" class="node-title">SKILL</text>
  <text x="690" y="162" text-anchor="middle" class="node-sub">strategy layer</text>

  <rect x="180" y="226" width="600" height="170" class="core"/>
  <text x="480" y="274" text-anchor="middle" class="core-title">OPENCODE RUNTIME CORE</text>
  <text x="480" y="304" text-anchor="middle" class="core-sub">SESSION LOOP · TOOL DISPATCH · MODEL CALL · STATE FLOW</text>

  <rect x="255" y="328" width="140" height="40" class="node"/>
  <text x="325" y="353" text-anchor="middle" class="node-sub" style="font-size:13px; font-weight:700; fill:#caf0f8;">MAIN LOOP</text>

  <rect x="410" y="328" width="140" height="40" class="node"/>
  <text x="480" y="353" text-anchor="middle" class="node-sub" style="font-size:13px; font-weight:700; fill:#caf0f8;">TOOL BUS</text>

  <rect x="565" y="328" width="140" height="40" class="node"/>
  <text x="635" y="353" text-anchor="middle" class="node-sub" style="font-size:13px; font-weight:700; fill:#caf0f8;">STATE STORE</text>

  <rect x="185" y="440" width="170" height="74" class="node"/>
  <text x="270" y="471" text-anchor="middle" class="node-title">SNAPSHOT</text>
  <text x="270" y="492" text-anchor="middle" class="node-sub">state capture</text>

  <rect x="395" y="440" width="170" height="74" class="node"/>
  <text x="480" y="471" text-anchor="middle" class="node-title">PERMISSION</text>
  <text x="480" y="492" text-anchor="middle" class="node-sub">guard rail</text>

  <rect x="605" y="440" width="170" height="74" class="node"/>
  <text x="690" y="471" text-anchor="middle" class="node-title">BACKGROUND</text>
  <text x="690" y="492" text-anchor="middle" class="node-sub">async work</text>

  <line x1="270" y1="184" x2="270" y2="226" class="arrow" marker-end="url(#arrow-cyan)"/>
  <line x1="480" y1="184" x2="480" y2="226" class="arrow" marker-end="url(#arrow-cyan)"/>
  <line x1="690" y1="184" x2="690" y2="226" class="arrow" marker-end="url(#arrow-cyan)"/>
  <line x1="270" y1="440" x2="270" y2="396" class="arrow" marker-end="url(#arrow-cyan)"/>
  <line x1="480" y1="440" x2="480" y2="396" class="arrow" marker-end="url(#arrow-cyan)"/>
  <line x1="690" y1="440" x2="690" y2="396" class="arrow" marker-end="url(#arrow-cyan)"/>

  <rect x="708" y="548" width="212" height="34" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1.6"/>
  <text x="814" y="570" text-anchor="middle" class="foot-label">EXTENSION SURFACE · BLUEPRINT</text>
</svg>
