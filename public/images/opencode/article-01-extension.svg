<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="OpenCode Persistence and Extension Surface">
  <style>
    text { font-family: 'Courier New', 'Lucida Console', monospace; }
    .title { font-size: 24px; font-weight: 700; fill: #caf0f8; }
    .subtitle { font-size: 13px; fill: #90e0ef; }
    .node-name { font-size: 14px; font-weight: 700; fill: #caf0f8; }
    .node-sub { font-size: 11px; fill: #90e0ef; }
    .node-detail { font-size: 10px; fill: #48cae4; opacity: 0.7; }
    .arrow-label { font-size: 10px; fill: #48cae4; }
    .muted { font-size: 10px; fill: #48cae4; opacity: 0.5; }
    .perm-label { font-size: 10px; fill: #f77f00; font-weight: 700; letter-spacing: 0.08em; }
  </style>

  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#112240" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00b4d8"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f77f00"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#0a1628"/>
  <rect width="960" height="600" fill="url(#grid)" opacity="0.6"/>

  <!-- Title -->
  <text x="480" y="42" text-anchor="middle" class="title">Persistence + Extension Surface</text>
  <text x="480" y="64" text-anchor="middle" class="subtitle">State is queryable — capabilities can grow</text>

  <!-- ==================== CENTER: Runtime ==================== -->
  <rect x="330" y="100" width="300" height="100" rx="4" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1.5"/>
  <text x="480" y="132" text-anchor="middle" class="node-name" font-size="18">Engine Runtime</text>
  <text x="480" y="155" text-anchor="middle" class="node-sub">Effect-TS · session / processor</text>
  <text x="480" y="175" text-anchor="middle" class="node-detail">HTTP API + WebSocket</text>

  <!-- ==================== BOTTOM: Persistence ==================== -->
  <rect x="120" y="420" width="280" height="90" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1.5"/>
  <text x="260" y="450" text-anchor="middle" class="node-name">SQLite (Drizzle ORM)</text>
  <text x="260" y="470" text-anchor="middle" class="node-sub">session / message / tool data</text>
  <text x="260" y="490" text-anchor="middle" class="node-detail">structured persistence</text>

  <rect x="430" y="420" width="280" height="90" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="570" y="450" text-anchor="middle" class="node-name">JSON Data Migration</text>
  <text x="570" y="470" text-anchor="middle" class="node-sub">upgradeable state format</text>
  <text x="570" y="490" text-anchor="middle" class="node-detail">version-aware · auto-migrate</text>

  <!-- ==================== EXTENSIONS (orbiting around runtime) ==================== -->

  <!-- Plugin -->
  <rect x="60" y="260" width="160" height="80" rx="2" fill="#0d1f3c" stroke="#06d6a0" stroke-width="1"/>
  <text x="140" y="290" text-anchor="middle" class="node-name">Plugin</text>
  <text x="140" y="310" text-anchor="middle" class="node-sub">public hook surface</text>
  <text x="140" y="326" text-anchor="middle" class="node-detail">7 hook types</text>

  <!-- MCP -->
  <rect x="250" y="260" width="140" height="80" rx="2" fill="#0d1f3c" stroke="#06d6a0" stroke-width="1"/>
  <text x="320" y="290" text-anchor="middle" class="node-name">MCP</text>
  <text x="320" y="310" text-anchor="middle" class="node-sub">stdio / SSE / HTTP</text>
  <text x="320" y="326" text-anchor="middle" class="node-detail">external tools</text>

  <!-- Skill -->
  <rect x="420" y="260" width="130" height="80" rx="2" fill="#0d1f3c" stroke="#06d6a0" stroke-width="1"/>
  <text x="485" y="290" text-anchor="middle" class="node-name">Skill</text>
  <text x="485" y="310" text-anchor="middle" class="node-sub">discover + inject</text>
  <text x="485" y="326" text-anchor="middle" class="node-detail">auto-detect</text>

  <!-- Snapshot -->
  <rect x="580" y="260" width="130" height="80" rx="2" fill="#0d1f3c" stroke="#06d6a0" stroke-width="1"/>
  <text x="645" y="290" text-anchor="middle" class="node-name">Snapshot</text>
  <text x="645" y="310" text-anchor="middle" class="node-sub">state save</text>
  <text x="645" y="326" text-anchor="middle" class="node-detail">restore</text>

  <!-- Background -->
  <rect x="750" y="260" width="150" height="80" rx="2" fill="#0d1f3c" stroke="#06d6a0" stroke-width="1"/>
  <text x="825" y="290" text-anchor="middle" class="node-name">Background</text>
  <text x="825" y="310" text-anchor="middle" class="node-sub">job scheduler</text>
  <text x="825" y="326" text-anchor="middle" class="node-detail">async tasks</text>

  <!-- ==================== Arrows: Runtime → Extensions ==================== -->
  <polyline points="330,180 140,260" stroke="#00b4d8" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>
  <polyline points="380,180 320,260" stroke="#00b4d8" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>
  <polyline points="480,180 485,260" stroke="#00b4d8" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>
  <polyline points="580,180 645,260" stroke="#00b4d8" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>
  <polyline points="630,180 825,260" stroke="#00b4d8" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>

  <!-- Arrow: Runtime → Persistence -->
  <polyline points="480,200 480,420" stroke="#00b4d8" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>
  <text x="510" y="320" class="arrow-label">persist</text>

  <!-- ==================== PERMISSION constraint ==================== -->
  <!-- Orange dashed box around extensions -->
  <rect x="40" y="240" width="880" height="120" rx="4" fill="none" stroke="#f77f00" stroke-width="0.8" stroke-dasharray="8,5" opacity="0.6"/>
  <text x="60" y="256" class="perm-label">CONSTRAINED BY — PERMISSION</text>
  <text x="60" y="356" class="muted">ask / allow / deny · Doom Loop detection</text>

  <!-- ==================== Key insight ==================== -->
  <rect x="200" y="545" width="560" height="40" rx="4" fill="none" stroke="#00b4d8" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="480" y="570" text-anchor="middle" font-size="12" fill="#caf0f8" font-weight="600">State is queryable — capabilities can grow</text>

  <!-- Title block -->
  <rect x="660" y="545" width="260" height="40" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="790" y="570" text-anchor="middle" fill="#00b4d8" font-size="12" font-weight="700">PERSISTENCE + EXTENSION</text>
</svg>
