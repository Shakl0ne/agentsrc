<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" role="img" aria-label="One Loop, Many Work Types">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 44px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 22px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 32px; font-weight: 700; fill: #f0f6fc; }
    .card-meta { font-size: 22px; font-weight: 500; fill: #d2dbe5; }
    .mini-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; }
    .mini-meta { font-size: 18px; font-weight: 500; fill: #d2dbe5; }
    .support { font-size: 18px; font-weight: 700; letter-spacing: 1.8px; fill: #8fc8ff; }
    .card { fill: rgba(255,255,255,0.07); stroke: rgba(255,255,255,0.17); stroke-width: 2; }
    .mini { fill: rgba(255,255,255,0.06); stroke: rgba(125,196,255,0.22); stroke-width: 1.5; }
    .card-line { stroke: rgba(255,255,255,0.24); stroke-width: 1.1; }
    .rail { fill: none; stroke: rgba(125,196,255,0.34); stroke-width: 4; stroke-linecap: round; }
    .rail-soft { fill: none; stroke: rgba(125,196,255,0.13); stroke-width: 14; stroke-linecap: round; }
    .flow { fill: none; stroke: rgba(125,196,255,0.86); stroke-width: 3.2; stroke-linecap: round; }
    .attach { fill: none; stroke: rgba(125,196,255,0.54); stroke-width: 2.2; stroke-linecap: round; }
    .dot { fill: rgba(125,196,255,0.92); }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="52%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowBlue" cx="20%" cy="24%" r="30%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="82%" cy="30%" r="28%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="52%" cy="84%" r="30%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="960" fill="url(#bg)"/>
  <rect width="1600" height="960" fill="url(#grid)"/>
  <rect width="1600" height="960" fill="url(#glowBlue)"/>
  <rect width="1600" height="960" fill="url(#glowPurple)"/>
  <rect width="1600" height="960" fill="url(#glowGreen)"/>

  <text x="800" y="68" text-anchor="middle" class="title">One Loop, Many Work Types</text>
  <text x="800" y="104" text-anchor="middle" class="subtitle">everything returns to one decision point</text>

  <path d="M800 150 V820" class="rail-soft"/>
  <path d="M800 150 V820" class="rail"/>

  <path d="M800 820 C800 880 800 910 1000 910 H1400 C1500 910 1500 860 1500 780 V200 C1500 140 1440 130 1350 130 H900" class="flow"/>
  <text x="1200" y="118" text-anchor="middle" class="support">CONTINUE RETURNS TO THE TOP</text>

  <g>
    <rect x="560" y="155" width="480" height="105" rx="24" class="card"/>
    <line x1="596" y1="185" x2="1004" y2="185" class="card-line"/>
    <text x="630" y="222" class="card-title">Rebuild State</text>
    <text x="630" y="250" class="card-meta">read msgs, rebuild model-visible view</text>
  </g>

  <g>
    <rect x="560" y="310" width="480" height="105" rx="24" class="card"/>
    <line x1="596" y1="340" x2="1004" y2="340" class="card-line"/>
    <text x="630" y="377" class="card-title">Check Exit</text>
    <text x="630" y="405" class="card-meta">finished assistant, no pending tool calls</text>
  </g>

  <g>
    <rect x="560" y="465" width="480" height="105" rx="24" class="card"/>
    <line x1="596" y1="495" x2="1004" y2="495" class="card-line"/>
    <text x="630" y="532" class="card-title">Pick Work</text>
    <text x="630" y="560" class="card-meta">subtask, compaction, or a normal turn</text>
  </g>

  <g>
    <rect x="200" y="460" width="250" height="70" rx="22" class="mini"/>
    <text x="325" y="500" text-anchor="middle" class="mini-title">SUBTASK</text>
    <text x="325" y="522" text-anchor="middle" class="mini-meta">queued work goes first</text>
    <path d="M450 495 C500 495 530 495 560 495" class="attach"/>
  </g>

  <g>
    <rect x="1150" y="460" width="250" height="70" rx="22" class="mini"/>
    <text x="1275" y="500" text-anchor="middle" class="mini-title">COMPACTION</text>
    <text x="1275" y="522" text-anchor="middle" class="mini-meta">overflow is a normal branch</text>
    <path d="M1040 495 C1090 495 1120 495 1150 495" class="attach"/>
  </g>

  <g>
    <rect x="560" y="620" width="480" height="105" rx="24" class="card"/>
    <line x1="596" y1="650" x2="1004" y2="650" class="card-line"/>
    <text x="630" y="687" class="card-title">Write Back</text>
    <text x="630" y="715" class="card-meta">tool parts, finish reason, usage, compaction</text>
  </g>

  <g>
    <rect x="670" y="824" width="260" height="52" rx="22" class="mini"/>
    <text x="800" y="858" text-anchor="middle" class="mini-title">LOOP OR STOP</text>
  </g>

  <circle cx="800" cy="260" r="5" class="dot"/>
  <circle cx="800" cy="415" r="5" class="dot"/>
  <circle cx="800" cy="570" r="5" class="dot"/>
  <circle cx="800" cy="725" r="5" class="dot"/>
</svg>
