<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" role="img" aria-label="One Loop, Many Work Types">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 40px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 34px; font-weight: 700; fill: #f0f6fc; }
    .card-meta { font-size: 22px; font-weight: 500; fill: #d2dbe5; }
    .label-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; }
    .label-meta { font-size: 18px; font-weight: 500; fill: #d2dbe5; }
    .support { font-size: 18px; font-weight: 700; letter-spacing: 1.6px; fill: #8fc8ff; }
    .card { fill: rgba(255,255,255,0.07); stroke: rgba(255,255,255,0.17); stroke-width: 2; }
    .label { fill: rgba(255,255,255,0.06); stroke: rgba(125,196,255,0.22); stroke-width: 1.5; }
    .rail { fill: none; stroke: rgba(125,196,255,0.34); stroke-width: 4; stroke-linecap: round; }
    .rail-soft { fill: none; stroke: rgba(125,196,255,0.13); stroke-width: 14; stroke-linecap: round; }
    .return { fill: none; stroke: rgba(125,196,255,0.82); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .link { fill: none; stroke: rgba(125,196,255,0.54); stroke-width: 3; stroke-linecap: round; }
    .dot { fill: rgba(125,196,255,0.92); }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="52%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowBlue" cx="20%" cy="24%" r="30%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="82%" cy="30%" r="28%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="52%" cy="84%" r="30%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="960" fill="url(#bg)"/>
  <rect width="1600" height="960" fill="url(#grid)"/>
  <rect width="1600" height="960" fill="url(#glowBlue)"/>
  <rect width="1600" height="960" fill="url(#glowPurple)"/>
  <rect width="1600" height="960" fill="url(#glowGreen)"/>

  <text x="800" y="68" text-anchor="middle" class="title">One Loop, Many Work Types</text>
  <text x="800" y="100" text-anchor="middle" class="subtitle">everything returns to one decision point</text>

  <path d="M360 260 V620" class="rail-soft"/>
  <path d="M360 260 V620" class="rail"/>
  <circle cx="360" cy="260" r="6" class="dot"/>
  <circle cx="360" cy="440" r="6" class="dot"/>
  <circle cx="360" cy="620" r="6" class="dot"/>

  <path d="M360 260 H460" class="link"/>
  <path d="M360 440 H460" class="link"/>
  <path d="M360 620 H460" class="link"/>

  <path d="M1160 620 H1260 V180 H1160" class="return"/>
  <text x="1260" y="166" text-anchor="middle" class="support">RETURN TO TOP</text>

  <g>
    <rect x="460" y="200" width="700" height="120" rx="28" class="card"/>
    <text x="548" y="256" class="card-title">Read State</text>
    <text x="548" y="290" class="card-meta">rebuild the model-visible view</text>
  </g>

  <g>
    <rect x="460" y="380" width="700" height="120" rx="28" class="card"/>
    <text x="548" y="436" class="card-title">Pick Work</text>
    <text x="548" y="470" class="card-meta">subtask / compaction / normal turn</text>
  </g>

  <g>
    <rect x="140" y="400" width="180" height="80" rx="22" class="label"/>
    <text x="230" y="434" text-anchor="middle" class="label-title">ONE LOOP</text>
    <text x="230" y="460" text-anchor="middle" class="label-meta">one decision point</text>
  </g>

  <g>
    <rect x="460" y="560" width="700" height="120" rx="28" class="card"/>
    <text x="548" y="616" class="card-title">Write Back</text>
    <text x="548" y="650" class="card-meta">persist tool, usage, finish state</text>
  </g>
</svg>
