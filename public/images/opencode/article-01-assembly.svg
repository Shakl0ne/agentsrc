<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="OpenCode Assembly Chain — Core Architecture">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, "Segoe UI", Arial, sans-serif; }
    .title   { font-size: 60px; font-weight: 800; fill: #f2fbff; }
    .subtitle{ font-size: 34px; font-weight: 600; fill: #90e0ef; }
    .layer   { font-size: 28px; font-weight: 800; fill: #67e8f9; letter-spacing: 2px; }
    .node    { font-size: 40px; font-weight: 800; fill: #ffffff; }
    .sub     { font-size: 28px; font-weight: 600; fill: #a8e6ff; }
    .detail  { font-size: 24px; font-weight: 500; fill: #6fd7ff; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d1f3c"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#123356" stroke-width="1"/>
    </pattern>
    <marker id="ah" markerWidth="13" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#22b8ff"/>
    </marker>
    <marker id="ag" markerWidth="13" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#22f0a8"/>
    </marker>
    <marker id="ao" markerWidth="13" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#ff9f43"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.5"/>

  <text x="800" y="70" text-anchor="middle" class="title">OpenCode Assembly Chain</text>
  <text x="800" y="116" text-anchor="middle" class="subtitle">CLI entry to runtime to session loop to model and tools to persistence</text>

  <!-- LAYER 1 ENTRY -->
  <text x="40" y="160" class="layer">LAYER 1 · CLI ENTRY</text>
  <rect x="40" y="174" width="1520" height="104" rx="10" fill="#0f2340" stroke="#22b8ff" stroke-width="5"/>
  <text x="800" y="216" text-anchor="middle" class="node">packages/opencode/src/index.ts</text>
  <text x="800" y="256" text-anchor="middle" class="sub">yargs assembly · 20+ subcommands · serve / config / session</text>
  <path d="M800 262 L800 320" stroke="#22b8ff" stroke-width="3" marker-end="url(#ah)"/>

  <!-- LAYER 2 ENGINE RUNTIME -->
  <text x="40" y="344" class="layer">LAYER 2 · ENGINE RUNTIME (same process)</text>
  <g>
    <rect x="40" y="358" width="470" height="140" rx="12" fill="#0f2340" stroke="#22b8ff" stroke-width="5"/>
    <text x="275" y="410" text-anchor="middle" class="node">serve</text>
    <text x="275" y="452" text-anchor="middle" class="sub">Effect runtime · ~40 services DI</text>
    <text x="275" y="486" text-anchor="middle" class="detail">InstanceState singleton</text>
    <rect x="560" y="358" width="460" height="140" rx="12" fill="#0f2340" stroke="#22f0a8" stroke-width="5"/>
    <text x="790" y="410" text-anchor="middle" class="node">HTTP API</text>
    <text x="790" y="452" text-anchor="middle" class="sub">REST endpoints</text>
    <text x="790" y="486" text-anchor="middle" class="detail">/session · /message · /tool · /config</text>
    <rect x="1070" y="358" width="490" height="140" rx="12" fill="#0f2340" stroke="#22f0a8" stroke-width="5"/>
    <text x="1315" y="410" text-anchor="middle" class="node">WebSocket</text>
    <text x="1315" y="452" text-anchor="middle" class="sub">tracker · stream</text>
    <text x="1315" y="486" text-anchor="middle" class="detail">real-time events · tool output</text>
  </g>

  <!-- LAYER 3 SESSION -->
  <text x="40" y="528" class="layer">LAYER 3 · SESSION RUNTIME (main loop)</text>
  <g>
    <rect x="40" y="542" width="350" height="110" rx="12" fill="#0f2340" stroke="#ff9f43" stroke-width="5"/>
    <text x="215" y="592" text-anchor="middle" class="node">session/processor</text>
    <text x="215" y="632" text-anchor="middle" class="sub">runLoop · step cycle</text>
    <rect x="425" y="542" width="320" height="110" rx="12" fill="#0f2340" stroke="#ff9f43" stroke-width="5"/>
    <text x="585" y="592" text-anchor="middle" class="node">LLM Call</text>
    <text x="585" y="632" text-anchor="middle" class="sub">AI SDK / Native</text>
    <rect x="780" y="542" width="360" height="110" rx="12" fill="#0f2340" stroke="#ff9f43" stroke-width="5"/>
    <text x="960" y="592" text-anchor="middle" class="node">Tool Registry</text>
    <text x="960" y="632" text-anchor="middle" class="sub">Edit · Grep · Glob · Read · Write</text>
    <rect x="1175" y="542" width="385" height="110" rx="12" fill="#0f2340" stroke="#22b8ff" stroke-width="5"/>
    <text x="1367" y="592" text-anchor="middle" class="node">Permission</text>
    <text x="1367" y="632" text-anchor="middle" class="sub">ask / allow / deny</text>
    <line x1="390" y1="597" x2="424" y2="597" stroke="#ff9f43" stroke-width="3" marker-end="url(#ao)"/>
    <line x1="745" y1="597" x2="779" y2="597" stroke="#ff9f43" stroke-width="3" marker-end="url(#ao)"/>
    <line x1="1140" y1="597" x2="1174" y2="597" stroke="#22b8ff" stroke-width="3" marker-end="url(#ah)"/>
  </g>

  <!-- LAYER 5 PERSISTENCE + EXTENSION -->
  <text x="40" y="688" class="layer">LAYER 5 · PERSISTENCE + EXTENSION</text>
  <g>
    <rect x="40" y="700" width="250" height="84" rx="10" fill="#0f2340" stroke="#22f0a8" stroke-width="5"/>
    <text x="165" y="745" text-anchor="middle" class="node">SQLite</text>
    <text x="165" y="774" text-anchor="middle" class="sub" style="font-size:22px">Drizzle ORM</text>
    <rect x="320" y="700" width="250" height="84" rx="10" fill="#0f2340" stroke="#22f0a8" stroke-width="5"/>
    <text x="445" y="745" text-anchor="middle" class="node">Plugin</text>
    <rect x="600" y="700" width="250" height="84" rx="10" fill="#0f2340" stroke="#22f0a8" stroke-width="5"/>
    <text x="725" y="745" text-anchor="middle" class="node">MCP</text>
    <rect x="880" y="700" width="250" height="84" rx="10" fill="#0f2340" stroke="#22f0a8" stroke-width="5"/>
    <text x="1005" y="745" text-anchor="middle" class="node">Skill</text>
    <rect x="1160" y="700" width="250" height="84" rx="10" fill="#0f2340" stroke="#22f0a8" stroke-width="5"/>
    <text x="1285" y="745" text-anchor="middle" class="node">Snapshot</text>
    <rect x="1440" y="700" width="140" height="84" rx="10" fill="#0f2340" stroke="#22f0a8" stroke-width="5"/>
    <text x="1510" y="735" text-anchor="middle" class="sub" style="font-size:22px;fill:#a8e6ff">Support</text>
  </g>

  <!-- vertical flow arrow through layers -->
  <path d="M275 326 L275 356" stroke="#22b8ff" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M275 498 L275 540" stroke="#ff9f43" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M286 652 L178 694" stroke="#22f0a8" stroke-width="3" marker-end="url(#ag)"/>
  <text x="800" y="846" text-anchor="middle" class="detail">one entry, one long-running chain, each layer hands off to the next</text>
</svg>