<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="OpenCode Assembly Chain — Core Architecture">
  <style>
    text { font-family: 'Courier New', 'Lucida Console', monospace; }
    .title { font-size: 28px; font-weight: 700; fill: #caf0f8; }
    .subtitle { font-size: 14px; fill: #90e0ef; }
    .node-name { font-size: 14px; font-weight: 700; fill: #caf0f8; }
    .node-sub { font-size: 11px; fill: #90e0ef; }
    .node-detail { font-size: 10px; fill: #48cae4; opacity: 0.7; }
    .arrow-label { font-size: 10px; fill: #48cae4; }
    .section-label { font-size: 11px; font-weight: 700; fill: #67e8f9; letter-spacing: 1.2px; text-transform: uppercase; }
    .muted { font-size: 10px; fill: #48cae4; opacity: 0.5; }
    .corner-text { font-size: 9px; fill: #48cae4; opacity: 0.4; }
  </style>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#112240" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00b4d8"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#06d6a0"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f77f00"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#0a1628"/>
  <rect width="1200" height="900" fill="url(#grid)" opacity="0.6"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" class="title">OpenCode Assembly Chain</text>
  <text x="600" y="66" text-anchor="middle" class="subtitle">From CLI entry to model execution — full architecture overview</text>

  <!-- ==================== LAYER 1: ENTRY ==================== -->
  <text x="30" y="110" class="section-label">LAYER 1 — CLI ENTRY</text>

  <!-- Entry box -->
  <rect x="40" y="120" width="320" height="80" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="200" y="150" text-anchor="middle" class="node-name">packages/opencode/src/index.ts</text>
  <text x="200" y="170" text-anchor="middle" class="node-sub">yargs assembly · 20+ subcommands</text>
  <text x="200" y="188" text-anchor="middle" class="node-detail">serve · config · session · init · ...</text>

  <!-- ==================== LAYER 2: RUNTIME ==================== -->
  <text x="30" y="250" class="section-label">LAYER 2 — ENGINE RUNTIME</text>

  <!-- Runtime container -->
  <rect x="40" y="260" width="600" height="140" rx="2" fill="none" stroke="#00b4d8" stroke-width="0.8" stroke-dasharray="6,4"/>
  <text x="55" y="278" class="muted">EFFECT RUNTIME (same process)</text>

  <!-- serve box -->
  <rect x="60" y="290" width="200" height="90" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="160" y="318" text-anchor="middle" class="node-name">serve</text>
  <text x="160" y="338" text-anchor="middle" class="node-sub">Effect runtime init</text>
  <text x="160" y="355" text-anchor="middle" class="node-detail">~40 Services DI</text>
  <text x="160" y="370" text-anchor="middle" class="node-detail">InstanceState singleton</text>

  <!-- HTTP API box -->
  <rect x="290" y="290" width="160" height="90" rx="2" fill="#0d1f3c" stroke="#06d6a0" stroke-width="1"/>
  <text x="370" y="318" text-anchor="middle" class="node-name">HTTP API</text>
  <text x="370" y="338" text-anchor="middle" class="node-sub">REST endpoints</text>
  <text x="370" y="355" text-anchor="middle" class="node-detail">/session /message</text>
  <text x="370" y="370" text-anchor="middle" class="node-detail">/config /tool</text>

  <!-- WebSocket box -->
  <rect x="470" y="290" width="160" height="90" rx="2" fill="#0d1f3c" stroke="#06d6a0" stroke-width="1"/>
  <text x="550" y="318" text-anchor="middle" class="node-name">WebSocket</text>
  <text x="550" y="338" text-anchor="middle" class="node-sub">tracker / stream</text>
  <text x="550" y="355" text-anchor="middle" class="node-detail">real-time events</text>
  <text x="550" y="370" text-anchor="middle" class="node-detail">tool output</text>

  <!-- Arrow: Entry → serve -->
  <polyline points="200,200 200,290" stroke="#00b4d8" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>

  <!-- ==================== LAYER 3: SESSION / MAIN LOOP ==================== -->
  <text x="30" y="440" class="section-label">LAYER 3 — SESSION RUNTIME</text>

  <!-- Main loop container -->
  <rect x="40" y="450" width="800" height="120" rx="2" fill="none" stroke="#00b4d8" stroke-width="0.8" stroke-dasharray="6,4"/>
  <text x="55" y="468" class="muted">session/processor — main loop (runLoop)</text>

  <!-- processor box -->
  <rect x="60" y="478" width="170" height="80" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="145" y="506" text-anchor="middle" class="node-name">session/processor</text>
  <text x="145" y="524" text-anchor="middle" class="node-sub">runLoop · 7-step cycle</text>
  <text x="145" y="540" text-anchor="middle" class="node-detail">while(true) { ... }</text>

  <!-- LLM call box -->
  <rect x="255" y="478" width="160" height="80" rx="2" fill="#0d1f3c" stroke="#f77f00" stroke-width="1"/>
  <text x="335" y="506" text-anchor="middle" class="node-name">LLM Call</text>
  <text x="335" y="524" text-anchor="middle" class="node-sub">handle.process</text>
  <text x="335" y="540" text-anchor="middle" class="node-detail">AI SDK / Native RT</text>

  <!-- Tool registry box -->
  <rect x="440" y="478" width="170" height="80" rx="2" fill="#0d1f3c" stroke="#f77f00" stroke-width="1"/>
  <text x="525" y="506" text-anchor="middle" class="node-name">Tool Registry</text>
  <text x="525" y="524" text-anchor="middle" class="node-sub">18 built-in tools</text>
  <text x="525" y="540" text-anchor="middle" class="node-detail">Edit/Grep/Glob/Read/Write</text>

  <!-- Permission box -->
  <rect x="635" y="478" width="180" height="80" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="725" y="506" text-anchor="middle" class="node-name">Permission</text>
  <text x="725" y="524" text-anchor="middle" class="node-sub">ask / allow / deny</text>
  <text x="725" y="540" text-anchor="middle" class="node-detail">Doom Loop detection</text>

  <!-- Arrow: Runtime → Processor -->
  <polyline points="160,400 160,478" stroke="#00b4d8" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>

  <!-- Internal arrows between loop elements -->
  <polyline points="230,518 255,518" stroke="#f77f00" stroke-width="1" fill="none" marker-end="url(#arrow-orange)"/>
  <polyline points="415,518 440,518" stroke="#f77f00" stroke-width="1" fill="none" marker-end="url(#arrow-orange)"/>
  <polyline points="610,518 635,518" stroke="#00b4d8" stroke-width="1" fill="none" marker-end="url(#arrow-cyan)"/>

  <!-- ==================== LAYER 4: SUPPORT PACKAGES ==================== -->
  <text x="30" y="610" class="section-label">LAYER 4 — SUPPORT PACKAGES</text>

  <!-- @opencode-ai/core -->
  <rect x="40" y="620" width="260" height="80" rx="2" fill="#0d1f3c" stroke="#06d6a0" stroke-width="1"/>
  <text x="170" y="648" text-anchor="middle" class="node-name">@opencode-ai/core</text>
  <text x="170" y="668" text-anchor="middle" class="node-sub">contracts + provider base</text>
  <text x="170" y="684" text-anchor="middle" class="node-detail">~12K lines · no internal deps</text>

  <!-- @opencode-ai/llm -->
  <rect x="330" y="620" width="260" height="80" rx="2" fill="#0d1f3c" stroke="#06d6a0" stroke-width="1"/>
  <text x="460" y="648" text-anchor="middle" class="node-name">@opencode-ai/llm</text>
  <text x="460" y="668" text-anchor="middle" class="node-sub">model protocol layer</text>
  <text x="460" y="684" text-anchor="middle" class="node-detail">~8.7K lines · independent</text>

  <!-- Arrow: processor → core/llm -->
  <polyline points="145,558 145,620" stroke="#06d6a0" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
  <polyline points="335,558 335,620" stroke="#06d6a0" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>

  <!-- ==================== LAYER 5: PERSISTENCE + EXTENSION ==================== -->
  <text x="30" y="740" class="section-label">LAYER 5 — PERSISTENCE + EXTENSION</text>

  <!-- SQLite -->
  <rect x="40" y="750" width="220" height="80" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="150" y="778" text-anchor="middle" class="node-name">SQLite (Drizzle ORM)</text>
  <text x="150" y="798" text-anchor="middle" class="node-sub">session / message / tool</text>
  <text x="150" y="814" text-anchor="middle" class="node-detail">structured persistence</text>

  <!-- Plugin -->
  <rect x="290" y="750" width="130" height="80" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="355" y="778" text-anchor="middle" class="node-name">Plugin</text>
  <text x="355" y="798" text-anchor="middle" class="node-sub">public hook surface</text>
  <text x="355" y="814" text-anchor="middle" class="node-detail">7 hook types</text>

  <!-- MCP -->
  <rect x="440" y="750" width="110" height="80" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="495" y="778" text-anchor="middle" class="node-name">MCP</text>
  <text x="495" y="798" text-anchor="middle" class="node-sub">stdio / SSE</text>
  <text x="495" y="814" text-anchor="middle" class="node-detail">StreamableHTTP</text>

  <!-- Skill -->
  <rect x="570" y="750" width="110" height="80" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="625" y="778" text-anchor="middle" class="node-name">Skill</text>
  <text x="625" y="798" text-anchor="middle" class="node-sub">discover + inject</text>
  <text x="625" y="814" text-anchor="middle" class="node-detail">auto-detect</text>

  <!-- Snapshot -->
  <rect x="700" y="750" width="110" height="80" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="755" y="778" text-anchor="middle" class="node-name">Snapshot</text>
  <text x="755" y="798" text-anchor="middle" class="node-sub">state save</text>
  <text x="755" y="814" text-anchor="middle" class="node-detail">restore</text>

  <!-- Background -->
  <rect x="830" y="750" width="130" height="80" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="895" y="778" text-anchor="middle" class="node-name">Background</text>
  <text x="895" y="798" text-anchor="middle" class="node-sub">job scheduler</text>
  <text x="895" y="814" text-anchor="middle" class="node-detail">async tasks</text>

  <!-- Arrow: runtime → persistence -->
  <polyline points="340,570 150,750" stroke="#00b4d8" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>
  <polyline points="540,570 355,750" stroke="#00b4d8" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>
  <polyline points="560,570 495,750" stroke="#00b4d8" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>
  <polyline points="580,570 625,750" stroke="#00b4d8" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>
  <polyline points="620,570 755,750" stroke="#00b4d8" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>
  <polyline points="660,570 895,750" stroke="#00b4d8" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>

  <!-- Title block -->
  <rect x="880" y="840" width="300" height="50" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <line x1="880" y1="858" x2="1180" y2="858" stroke="#00b4d8" stroke-width="0.5"/>
  <text x="1030" y="853" text-anchor="middle" fill="#caf0f8" font-size="9">SYSTEM ARCHITECTURE</text>
  <text x="1030" y="878" text-anchor="middle" fill="#00b4d8" font-size="14" font-weight="700">ASSEMBLY CHAIN</text>

  <!-- Corner annotations -->
  <text x="1160" y="42" text-anchor="end" class="corner-text">DWG: OPN-001 · REV 1.0</text>
  <text x="1160" y="56" text-anchor="end" class="corner-text">OPencode Architecture</text>
</svg>
