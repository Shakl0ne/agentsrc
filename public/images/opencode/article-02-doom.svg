<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Doom Loop Needs a Permission Gate">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 40px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #b7c3d2; }
    .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2.1px; fill: #9fb1c8; }
    .card-title { font-size: 24px; font-weight: 700; fill: #f0f6fc; }
    .card-meta { font-size: 17px; font-weight: 500; fill: #d2dbe5; }
    .mini-title { font-size: 17px; font-weight: 700; fill: #f0f6fc; }
    .mini-meta { font-size: 16px; font-weight: 500; fill: #d2dbe5; }
    .support { font-size: 16px; font-weight: 700; letter-spacing: 1.6px; fill: #8fc8ff; }
    .card { fill: rgba(255,255,255,0.07); stroke: rgba(255,255,255,0.17); stroke-width: 2; }
    .mini { fill: rgba(255,255,255,0.06); stroke: rgba(125,196,255,0.22); stroke-width: 1.5; }
    .flow { fill: none; stroke: rgba(125,196,255,0.84); stroke-width: 3.2; stroke-linecap: round; }
    .attach { fill: none; stroke: rgba(125,196,255,0.54); stroke-width: 2.2; stroke-linecap: round; }
    .guide { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 1; }
    .dot { fill: rgba(125,196,255,0.90); }
    .warn { fill: rgba(247,129,102,0.16); stroke: rgba(247,129,102,0.56); stroke-width: 2; }
    .ok { fill: rgba(63,185,80,0.12); stroke: rgba(63,185,80,0.40); stroke-width: 1.8; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="52%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowBlue" cx="18%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="82%" cy="24%" r="28%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="54%" cy="84%" r="30%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glowBlue)"/>
  <rect width="1600" height="900" fill="url(#glowPurple)"/>
  <rect width="1600" height="900" fill="url(#glowGreen)"/>

  <text x="800" y="72" text-anchor="middle" class="title">Doom Loop Needs a Permission Gate</text>
  <text x="800" y="106" text-anchor="middle" class="subtitle">repetition without progress should ask, not auto-ban</text>

  <path d="M124 456 H1480" class="guide"/>
  <path d="M214 456 H986" class="flow"/>
  <path d="M1380 456 H1470" class="flow"/>
  <circle cx="302" cy="456" r="5" class="dot"/>
  <circle cx="522" cy="456" r="5" class="dot"/>
  <circle cx="742" cy="456" r="5" class="dot"/>
  <circle cx="1218" cy="456" r="5" class="dot"/>
  <circle cx="1408" cy="456" r="5" class="dot"/>

  <text x="214" y="494" class="support">REPEAT DETECTION BEFORE THE GATE</text>
  <text x="1102" y="494" class="support">ASK FIRST, THEN LET THE USER DECIDE</text>

  <g>
    <rect x="130" y="324" width="190" height="96" rx="24" class="mini"/>
    <text x="164" y="360" class="mini-title">TOOL CALL 01</text>
    <text x="164" y="388" class="mini-meta">same tool</text>
    <text x="164" y="412" class="mini-meta">same input</text>
  </g>

  <g>
    <rect x="350" y="324" width="190" height="96" rx="24" class="mini"/>
    <text x="384" y="360" class="mini-title">TOOL CALL 02</text>
    <text x="384" y="388" class="mini-meta">same tool</text>
    <text x="384" y="412" class="mini-meta">same input</text>
  </g>

  <g>
    <rect x="570" y="324" width="190" height="96" rx="24" class="mini"/>
    <text x="604" y="360" class="mini-title">TOOL CALL 03</text>
    <text x="604" y="388" class="mini-meta">same tool</text>
    <text x="604" y="412" class="mini-meta">same input</text>
  </g>

  <g>
    <rect x="790" y="324" width="210" height="96" rx="24" class="mini"/>
    <text x="824" y="360" class="mini-title">TOOL CALL 04</text>
    <text x="824" y="388" class="mini-meta">still no progress</text>
    <text x="824" y="412" class="mini-meta">threshold reached</text>
  </g>

  <g>
    <rect x="1080" y="248" width="300" height="244" rx="28" class="warn"/>
    <text x="1230" y="302" text-anchor="middle" class="eyebrow">GATE</text>
    <text x="1230" y="342" text-anchor="middle" class="card-title">permission.ask()</text>
    <text x="1230" y="378" text-anchor="middle" class="card-meta">the framework sees repetition</text>
    <text x="1230" y="406" text-anchor="middle" class="card-meta">but does not assume it is wrong</text>
    <text x="1230" y="440" text-anchor="middle" class="card-meta">it asks before blocking</text>
  </g>

  <g>
    <rect x="1050" y="596" width="260" height="92" rx="24" class="ok"/>
    <text x="1180" y="632" text-anchor="middle" class="mini-title">ALLOW</text>
    <text x="1180" y="660" text-anchor="middle" class="mini-meta">continue if repetition is valid</text>
  </g>

  <g>
    <rect x="1090" y="522" width="280" height="92" rx="24" class="mini"/>
    <text x="1230" y="558" text-anchor="middle" class="mini-title">ASK USER</text>
    <text x="1230" y="586" text-anchor="middle" class="mini-meta">show context before deciding</text>
  </g>

  <g>
    <rect x="1340" y="596" width="160" height="92" rx="24" class="warn"/>
    <text x="1420" y="632" text-anchor="middle" class="mini-title">STOP</text>
    <text x="1420" y="660" text-anchor="middle" class="mini-meta">only if denied</text>
  </g>

  <path d="M1000 372 C1030 372 1048 372 1080 372" class="attach"/>
  <path d="M1230 492 L1230 522" class="attach"/>
  <path d="M1310 642 H1340" class="attach"/>
</svg>
