<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Doom Loop Needs a Permission Gate">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 40px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #b7c3d2; }
    .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2.1px; fill: #9fb1c8; }
    .card-title { font-size: 24px; font-weight: 700; fill: #f0f6fc; }
    .card-meta { font-size: 17px; font-weight: 500; fill: #d2dbe5; }
    .mini-title { font-size: 17px; font-weight: 700; fill: #f0f6fc; }
    .mini-meta { font-size: 16px; font-weight: 500; fill: #d2dbe5; }
    .support { font-size: 16px; font-weight: 700; letter-spacing: 1.6px; fill: #8fc8ff; }
    .card { fill: rgba(255,255,255,0.07); stroke: rgba(255,255,255,0.17); stroke-width: 2; }
    .mini { fill: rgba(255,255,255,0.06); stroke: rgba(125,196,255,0.22); stroke-width: 1.5; }
    .flow { fill: none; stroke: rgba(125,196,255,0.84); stroke-width: 3.2; stroke-linecap: round; }
    .attach { fill: none; stroke: rgba(125,196,255,0.54); stroke-width: 2.2; stroke-linecap: round; }
    .guide { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 1; }
    .dot { fill: rgba(125,196,255,0.90); }
    .warn { fill: rgba(247,129,102,0.16); stroke: rgba(247,129,102,0.56); stroke-width: 2; }
    .ok { fill: rgba(63,185,80,0.12); stroke: rgba(63,185,80,0.40); stroke-width: 1.8; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="52%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowBlue" cx="18%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="82%" cy="24%" r="28%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="54%" cy="84%" r="30%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glowBlue)"/>
  <rect width="1600" height="900" fill="url(#glowPurple)"/>
  <rect width="1600" height="900" fill="url(#glowGreen)"/>

  <text x="800" y="72" text-anchor="middle" class="title">Doom Loop Needs a Permission Gate</text>
  <text x="800" y="106" text-anchor="middle" class="subtitle">repetition without progress should ask, not auto-ban</text>

  <path d="M164 456 H1438" class="guide"/>
  <path d="M250 456 H704" class="flow"/>
  <path d="M914 456 H1350" class="flow"/>
  <circle cx="338" cy="456" r="5" class="dot"/>
  <circle cx="494" cy="456" r="5" class="dot"/>
  <circle cx="650" cy="456" r="5" class="dot"/>
  <circle cx="1016" cy="456" r="5" class="dot"/>
  <circle cx="1178" cy="456" r="5" class="dot"/>

  <text x="250" y="494" class="support">REPEAT DETECTION BEFORE THE GATE</text>
  <text x="952" y="494" class="support">ASK FIRST, THEN LET THE USER DECIDE</text>

  <g>
    <rect x="170" y="324" width="190" height="96" rx="24" class="mini"/>
    <text x="204" y="360" class="mini-title">TOOL CALL 01</text>
    <text x="204" y="388" class="mini-meta">same tool</text>
    <text x="204" y="412" class="mini-meta">same input</text>
  </g>

  <g>
    <rect x="326" y="324" width="190" height="96" rx="24" class="mini"/>
    <text x="360" y="360" class="mini-title">TOOL CALL 02</text>
    <text x="360" y="388" class="mini-meta">same tool</text>
    <text x="360" y="412" class="mini-meta">same input</text>
  </g>

  <g>
    <rect x="482" y="324" width="190" height="96" rx="24" class="mini"/>
    <text x="516" y="360" class="mini-title">TOOL CALL 03</text>
    <text x="516" y="388" class="mini-meta">same tool</text>
    <text x="516" y="412" class="mini-meta">same input</text>
  </g>

  <g>
    <rect x="638" y="324" width="190" height="96" rx="24" class="mini"/>
    <text x="672" y="360" class="mini-title">TOOL CALL 04</text>
    <text x="672" y="388" class="mini-meta">still no progress</text>
    <text x="672" y="412" class="mini-meta">threshold reached</text>
  </g>

  <g>
    <rect x="740" y="260" width="240" height="228" rx="28" class="warn"/>
    <text x="860" y="314" text-anchor="middle" class="eyebrow">GATE</text>
    <text x="860" y="354" text-anchor="middle" class="card-title">permission.ask()</text>
    <text x="860" y="390" text-anchor="middle" class="card-meta">the framework sees repetition</text>
    <text x="860" y="418" text-anchor="middle" class="card-meta">but does not assume it is wrong</text>
    <text x="860" y="452" text-anchor="middle" class="card-meta">it asks before blocking</text>
  </g>

  <g>
    <rect x="1030" y="284" width="250" height="90" rx="24" class="ok"/>
    <text x="1155" y="320" text-anchor="middle" class="mini-title">ALLOW</text>
    <text x="1155" y="348" text-anchor="middle" class="mini-meta">continue if repetition is valid</text>
  </g>

  <g>
    <rect x="1030" y="418" width="250" height="90" rx="24" class="mini"/>
    <text x="1155" y="454" text-anchor="middle" class="mini-title">ASK USER</text>
    <text x="1155" y="482" text-anchor="middle" class="mini-meta">show context before deciding</text>
  </g>

  <g>
    <rect x="1312" y="350" width="160" height="92" rx="24" class="warn"/>
    <text x="1392" y="388" text-anchor="middle" class="mini-title">STOP</text>
    <text x="1392" y="416" text-anchor="middle" class="mini-meta">only if denied</text>
  </g>

  <path d="M980 330 C1000 330 1008 330 1030 330" class="attach"/>
  <path d="M980 462 C1000 462 1008 462 1030 462" class="attach"/>
  <path d="M1280 396 C1292 396 1298 396 1312 396" class="attach"/>
</svg>
