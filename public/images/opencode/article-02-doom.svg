<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Doom Loop Needs a Permission Gate">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 44px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 22px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 30px; font-weight: 700; fill: #f0f6fc; }
    .card-meta { font-size: 22px; font-weight: 500; fill: #d2dbe5; }
    .mini-title { font-size: 22px; font-weight: 700; fill: #f0f6fc; }
    .mini-meta { font-size: 20px; font-weight: 500; fill: #d2dbe5; }
    .card { fill: rgba(255,255,255,0.07); stroke: rgba(255,255,255,0.17); stroke-width: 2; }
    .mini { fill: rgba(255,255,255,0.06); stroke: rgba(125,196,255,0.22); stroke-width: 1.5; }
    .flow { fill: none; stroke: rgba(125,196,255,0.84); stroke-width: 3.2; stroke-linecap: round; }
    .attach { fill: none; stroke: rgba(125,196,255,0.54); stroke-width: 2.2; stroke-linecap: round; }
    .warn { fill: rgba(247,129,102,0.16); stroke: rgba(247,129,102,0.56); stroke-width: 2; }
    .ok { fill: rgba(63,185,80,0.12); stroke: rgba(63,185,80,0.40); stroke-width: 1.8; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="52%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowBlue" cx="18%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="82%" cy="24%" r="28%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="54%" cy="84%" r="30%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glowBlue)"/>
  <rect width="1600" height="900" fill="url(#glowPurple)"/>
  <rect width="1600" height="900" fill="url(#glowGreen)"/>

  <text x="800" y="68" text-anchor="middle" class="title">Doom Loop Needs a Permission Gate</text>
  <text x="800" y="104" text-anchor="middle" class="subtitle">repetition without progress should ask, not auto-ban</text>

  <text x="200" y="195" fill="#8fc8ff" font-size="18" font-weight="700" letter-spacing="1.6">REPEAT DETECTION</text>

  <g>
    <rect x="200" y="220" width="300" height="120" rx="28" class="mini"/>
    <text x="350" y="270" text-anchor="middle" class="mini-title">TOOL CALL 01</text>
    <text x="350" y="300" text-anchor="middle" class="mini-meta">same tool, same input, no progress</text>
  </g>

  <g>
    <rect x="560" y="220" width="300" height="120" rx="28" class="mini"/>
    <text x="710" y="270" text-anchor="middle" class="mini-title">TOOL CALL 02</text>
    <text x="710" y="300" text-anchor="middle" class="mini-meta">still no progress, threshold reached</text>
  </g>

  <path d="M860 280 H920" class="flow"/>

  <g>
    <rect x="920" y="180" width="420" height="300" rx="28" class="warn"/>
    <text x="1130" y="240" text-anchor="middle" fill="#9fb1c8" font-size="20" font-weight="700" letter-spacing="2.2">GATE</text>
    <text x="1130" y="290" text-anchor="middle" class="card-title">permission.ask()</text>
    <text x="1130" y="336" text-anchor="middle" class="card-meta">sees repetition</text>
    <text x="1130" y="370" text-anchor="middle" class="card-meta">does not assume it is wrong</text>
    <text x="1130" y="404" text-anchor="middle" class="card-meta">asks before blocking</text>
  </g>

  <text x="800" y="530" text-anchor="middle" fill="#8fc8ff" font-size="18" font-weight="700" letter-spacing="1.6">ASK FIRST, THEN LET THE USER DECIDE</text>

  <path d="M1130 480 L1130 510" class="attach"/>

  <g>
    <rect x="460" y="560" width="360" height="100" rx="24" class="mini"/>
    <text x="640" y="605" text-anchor="middle" class="mini-title">ASK USER</text>
    <text x="640" y="638" text-anchor="middle" class="mini-meta">show context before deciding</text>
  </g>

  <path d="M820 610 H880" class="attach"/>

  <g>
    <rect x="880" y="560" width="260" height="100" rx="24" class="ok"/>
    <text x="1010" y="605" text-anchor="middle" class="mini-title">ALLOW</text>
    <text x="1010" y="638" text-anchor="middle" class="mini-meta">continue if valid</text>
  </g>

  <path d="M1140 610 H1200" class="attach"/>

  <g>
    <rect x="1200" y="560" width="240" height="100" rx="24" class="warn"/>
    <text x="1320" y="605" text-anchor="middle" class="mini-title">STOP</text>
    <text x="1320" y="638" text-anchor="middle" class="mini-meta">only if denied</text>
  </g>
</svg>
