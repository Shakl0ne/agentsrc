<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="Three context derivations: extend, isolate, intercept — parent never mutates">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 36px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 16px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.35); stroke-width: 2; }
    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
    .invariant { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.25); stroke-width: 1.5; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="52" text-anchor="middle" class="title">THREE CONTEXT DERIVATIONS</text>
  <text x="500" y="84" text-anchor="middle" class="subtitle">Extend · isolate · intercept — parent never mutates</text>

  <!-- Parent context (top) -->
  <rect x="370" y="120" width="260" height="90" rx="12" class="card-highlight"/>
  <text x="500" y="158" class="card-title">Context (parent)</text>
  <text x="500" y="186" class="inner-sub">ctx.tools · ctx.llm</text>

  <!-- Three arrows down to children -->
  <path d="M430 210 C 400 250, 250 270, 180 300" class="spine"/>
  <path d="M500 210 L500 300" class="spine"/>
  <path d="M570 210 C 600 250, 750 270, 820 300" class="spine"/>

  <!-- Child 1: extend -->
  <rect x="60" y="304" width="240" height="130" rx="12" class="card"/>
  <text x="180" y="344" class="card-title">extend({ meta })</text>
  <text x="180" y="376" class="inner-text">prototypal</text>
  <text x="180" y="400" class="inner-sub">own props shadow parent</text>

  <!-- Child 2: isolate -->
  <rect x="380" y="304" width="240" height="130" rx="12" class="card"/>
  <text x="500" y="344" class="card-title">isolate('tools')</text>
  <text x="500" y="376" class="inner-text">scope label</text>
  <text x="500" y="400" class="inner-sub">new scope resolution</text>

  <!-- Child 3: intercept -->
  <rect x="700" y="304" width="240" height="130" rx="12" class="card"/>
  <text x="820" y="344" class="card-title">intercept('llm')</text>
  <text x="820" y="376" class="inner-text">merged config</text>
  <text x="820" y="400" class="inner-sub">ancestors apply first</text>

  <!-- Bottom invariant banner -->
  <rect x="330" y="500" width="340" height="46" rx="10" class="invariant"/>
  <text x="500" y="529" class="inner-text">parent is never mutated</text>
</svg>
