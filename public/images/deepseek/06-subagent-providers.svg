<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="One registry, many providers coexist">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 36px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 20px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 16px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 16px; font-weight: 700; fill: #9fb1c8; text-anchor: middle; }
    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.35); stroke-width: 2; }
    .panel-local { fill: rgba(88,166,255,0.05); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .panel-remote { fill: rgba(63,185,80,0.05); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; }
    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
    .label-blue { font-size: 17px; font-weight: 700; fill: #79c0ff; text-anchor: middle; }
    .label-green { font-size: 17px; font-weight: 700; fill: #7ee2a8; text-anchor: middle; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="52" text-anchor="middle" class="title">ONE REGISTRY, SIX PROVIDERS</text>
  <text x="500" y="80" text-anchor="middle" class="subtitle">named coexistence unlike the single bash executor</text>

  <!-- Consumer -->
  <rect x="250" y="108" width="500" height="62" rx="12" class="card"/>
  <text x="500" y="134" class="card-title">subagent tools</text>
  <text x="500" y="156" class="inner-sub">delegate by provider name</text>

  <!-- Registry (center) -->
  <path d="M500 170 L500 204" class="spine"/>
  <rect x="330" y="208" width="340" height="62" rx="12" class="card-highlight"/>
  <text x="500" y="234" class="card-title">ctx.subagents</text>
  <text x="500" y="256" class="inner-sub">LLM adapter pattern</text>

  <!-- connectors to groups -->
  <path d="M420 270 C 350 306, 300 324, 250 344" class="spine"/>
  <path d="M580 270 C 650 306, 700 324, 750 344" class="spine"/>

  <!-- IN-PROCESS group -->
  <rect x="60" y="344" width="380" height="196" rx="14" class="panel-local"/>
  <text x="250" y="376" class="label-blue">IN-PROCESS</text>
  <rect x="84" y="392" width="332" height="44" rx="8" class="inner-card"/>
  <text x="250" y="418" class="inner-text">spawn-in-process</text>
  <rect x="84" y="444" width="332" height="44" rx="8" class="inner-card"/>
  <text x="250" y="470" class="inner-text">fork-in-process</text>
  <text x="250" y="510" class="inner-sub">seeded from parent history</text>

  <!-- OUT-OF-PROCESS group -->
  <rect x="560" y="344" width="380" height="196" rx="14" class="panel-remote"/>
  <text x="750" y="376" class="label-green">OUT-OF-PROCESS</text>
  <rect x="584" y="392" width="332" height="40" rx="8" class="inner-card"/>
  <text x="750" y="418" class="inner-text">acp — Agent Client Protocol</text>
  <rect x="584" y="440" width="332" height="40" rx="8" class="inner-card"/>
  <text x="750" y="466" class="inner-text">codex — app-server</text>
  <rect x="584" y="488" width="332" height="40" rx="8" class="inner-card"/>
  <text x="750" y="514" class="inner-text">claude-code (SDK)</text>
</svg>
