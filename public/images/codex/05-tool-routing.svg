<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Tool Abstraction and Routing">
  <style>
    text { font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: url(#titleGrad); }
    .subtitle { font-size: 18px; font-weight: 500; fill: #b7c3d2; }
    .card-title { font-size: 20px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
    .inner-text { font-size: 16px; font-weight: 600; fill: #d2dbe5; text-anchor: middle; }
    .inner-sub { font-size: 13px; font-weight: 500; fill: #8b9eb3; text-anchor: middle; }
    .arrow-text { font-size: 14px; font-weight: 600; fill: #9fb1c8; text-anchor: middle; }

    .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .inner-card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
    .card-highlight { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.3); stroke-width: 1.5; }
    .card-async { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.3); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .card-warn { fill: rgba(239,68,68,0.08); stroke: rgba(239,68,68,0.3); stroke-width: 1.5; }
    .card-core { fill: rgba(168,85,247,0.08); stroke: rgba(168,85,247,0.4); stroke-width: 2; }

    .spine { fill: none; stroke: rgba(125,196,255,0.5); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-async { fill: none; stroke: rgba(63,185,80,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spine-warn { fill: none; stroke: rgba(239,68,68,0.6); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(125,196,255,0.6)"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(63,185,80,0.8)"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(239,68,68,0.8)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="60" text-anchor="middle" class="title">TOOL ABSTRACTION &amp; ROUTING</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">Decoupling tool definitions from execution via ToolExecutor trait</text>

  <!-- Left: LLM Response -->
  <rect x="50" y="270" width="220" height="60" rx="8" class="card"/>
  <text x="160" y="298" class="card-title">LLM Response</text>
  <text x="160" y="318" class="inner-sub">tool_calls</text>

  <path d="M 270 300 L 350 300" class="spine" marker-end="url(#arrow)"/>

  <!-- Center: ToolRouter -->
  <rect x="350" y="250" width="240" height="100" rx="16" class="card-core"/>
  <text x="470" y="295" class="card-title">ToolRouter</text>
  <text x="470" y="325" class="inner-text">&amp; ToolRegistry</text>

  <!-- Right: Handlers -->
  <rect x="700" y="150" width="240" height="60" rx="8" class="inner-card"/>
  <text x="820" y="178" class="card-title">Built-in Handler</text>
  <text x="820" y="198" class="inner-sub">e.g., shell_command</text>

  <rect x="700" y="270" width="240" height="60" rx="8" class="card-async" style="stroke-dasharray: none;"/>
  <text x="820" y="298" class="card-title">McpHandler</text>
  <text x="820" y="318" class="inner-sub">External MCP Tool</text>

  <rect x="700" y="390" width="240" height="60" rx="8" class="card-warn"/>
  <text x="820" y="418" class="card-title" fill="#ef4444">Hidden Handler</text>
  <text x="820" y="438" class="inner-sub">Internal routing only</text>

  <!-- Routing Arrows -->
  <path d="M 590 300 L 640 300 L 640 180 L 700 180" class="spine" marker-end="url(#arrow)"/>
  <text x="660" y="235" class="arrow-text">Dispatches</text>

  <path d="M 590 300 L 700 300" class="spine-async" marker-end="url(#arrow-async)"/>
  <text x="645" y="290" class="arrow-text" fill="#3fb950">Dispatches</text>

  <path d="M 590 300 L 640 300 L 640 420 L 700 420" class="spine-warn" marker-end="url(#arrow-warn)"/>
  <text x="660" y="375" class="arrow-text" fill="#ef4444">Dispatches</text>

  <!-- Interface Label -->
  <rect x="740" y="100" width="160" height="30" rx="4" fill="rgba(255,255,255,0.05)"/>
  <text x="820" y="120" class="inner-sub">impl ToolExecutor</text>

</svg>